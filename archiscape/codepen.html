  same town in any era, from Stonehenge, Athens and Rome through Jiangnan, Moscow and Prussia to Richard Meier,
  Tadao Ando, Frank Gehry and Zaha Hadid. Built on the VibeXR Interaction Framework v0.8.25.

  VibeXR Interaction Framework v0.8.25 - single-file build (open in PICO / Quest / Galaxy XR / Vision Pro browser, tap Enter)

  Changelog, newest first
  0.8.25  one Enter button, no second VR button: AR with VST on; headsets without AR enter VR through the same button
  0.8.24  hover outline: welded by position only and centred on each part (no gaps or shards on CAD
          meshes); opts.outlinePush draws a silhouette-only outline pushed along the surface normals
  0.8.23  select sound: a crisp mouse click on press and a softer, higher click on release (was a finger snap)
  0.8.22  sketch surface is hit-testable again: its collider hides its material, not the object
  0.8.21  UI draws opaque with an alpha cutout, so depth (not origin sorting) orders panels, buttons and grid
  0.8.20  no passthrough through the UI: opaque pills, handle and slider track; collider boxes not drawn
  0.8.19  UI and hover outline sort by distance; only true overlays keep an explicit renderOrder
  0.8.18  floating desk plate; sketch board is one panel with a capsule header row; labels shrink to fit
  0.8.17  desk plate is a short cylinder with 4 px rims; hover outline renders after the UI
  0.8.16  one palette: black bases, white lines and text, grey floor rings
  0.8.15  hover outline is a screen-space hull of constant pixel width, with no gaps at corners
  0.8.14  hover / press feedback is a white outline instead of an emissive glow
  0.8.13  panels, log, drawing surface and desk get an opaque black base
  0.8.12  finger-snap select sound; white-line sketch style across the UI; swatches show their true colour
  0.8.11  hand menu and UI restyled to white-line sketch; radial floor rings; WebAudio click on press
  0.8.10  ray vs direct decided by hover alone: nothing -> ray, near target -> no ray, far target -> ray
  0.8.9   no cursor ball in either mode
  0.8.8   larger direct range (near 5 / 6 cm, poke hover 6 cm); far speed gain only above 0.6 m/s
  0.8.7   far grab keeps its pick distance; 2 deg far cone; cursor / ray blend smoothly between states
  0.8.6   board scales only while its handle is held; cube collisions and settle-to-table removed
  0.8.5   board faces the viewer only while held, computed from the panel centre
  0.8.4   table calibrated 0.5 m below the headset on start / reset; softer far depth gain
  0.8.2-3 board distance scaling: fixed inside 0.5 m, then linear beyond it
  0.8.0   sketch board pivots on its handle bar
  0.7.x   sketch board (draw with any input); opts.multi; opts.translateOnly; spatial cursor-depth solver;
          hand mask occludes all geometry
  0.6.x   hands drawn as a white outline (joints optional); throw / inertia removed
  0.5     select via session events for gamepad-less sources (Vision Pro, gaze); sticky far hover;
          opts.precise and opts.constrain; mouse wheel push / pull while dragging
