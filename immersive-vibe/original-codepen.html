  v0.8.3: board never looks smaller with distance - slope K = 1 (constant angular size) and the 4x upper
          clamp removed, so beyond 0.5 m the scale follows the same linear slope however far the board goes.
  v0.8.2: board distance scaling - fixed inside 0.5 m, beyond that linear with slope 0.8 (BOARD_SCALE_NEAR / _K).

  v0.7.9: sketch board scales with distance to the viewer (constant angular size); two-hand scale edits the

      vec3 col = mix(DEEP * 0.8, COBALT, smoothstep(0.0, 0.6, v));
      col = mix(col, SKY,  smoothstep(0.55, 0.95, v) * 0.85);
      col = mix(col, PALE, smoothstep(0.9, 1.0, v) * 0.4);
      return col;
    }
    // Carry a point on the dome along the vortex field for 'age' seconds.
    vec3 advect(vec3 p, float age) {
      for (int i = 0; i < ${MAXV}; i++) {
        if (i >= uVCount) break;
        vec3 ax = uVDir[i];
        vec4 P  = uVPar[i];
        float ang  = acos(clamp(dot(p, ax), -1.0, 1.0));
        float fall = exp(-ang * ang / (2.0 * P.y * P.y));
        float rot  = fall * P.z * (P.x * 0.55 * age + P.x * 0.25 * sin(P.w + age * 0.7));
        p = rotAxis(p, ax, rot);
      }
      p = rotAxis(p, vec3(0.0, 1.0, 0.0), age * 0.012);       // the slow wind that turns the whole sky
      vec3 nz = vec3(noise3(p * 3.0 + 1.3), noise3(p * 3.0 + 7.1), noise3(p * 3.0 + 13.7)) - 0.5;
      return normalize(p + nz * 0.05 * min(age, 4.0));         // wandering, so the strokes don't stay in rank
    }`;

  /* ---------- the gloom: a dark, empty dome — every light in the scene is a particle ---------- */
  const skyVert = `
    varying vec3 vDir;
    void main() { vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`;
  const skyFrag = `
    precision highp float;
    uniform float uAlpha;
    varying vec3 vDir;
    void main() {
      vec3 d = normalize(vDir);
      vec3 zenith  = vec3(0.008, 0.012, 0.035);
      vec3 horizon = vec3(0.028, 0.045, 0.095);
      vec3 col = mix(horizon, zenith, smoothstep(-0.05, 0.75, d.y));
      col = mix(col, vec3(0.006, 0.009, 0.02), smoothstep(0.02, -0.15, d.y));
      gl_FragColor = vec4(col, uAlpha);
    }`;

  /* ---------- the sky particles ---------- */
  // Small glowing balls carried by the flow, drawn as instanced low-poly spheres. A second population is
  // bound to the stars: it orbits each one, so the halos are made of the same stuff as the sky.
  const N_SKY = 20000;
  const N_STAR = 4200;
  const N = N_SKY + N_STAR;
  const DOME = 480.0;

  const glowFrag = `
    precision highp float;
    varying vec3  vColor;
    varying vec3  vNormal;
    varying vec3  vView;
    varying float vGlow;
    void main() {
      // Unlit: every dab is a flat touch of paint, identical in both eyes.
      gl_FragColor = vec4(vColor * vGlow * 0.72, 1.0);
    }`;

  const dabVert = `
    precision highp float;
    ${glslCommon}
    attribute float seed;        // per instance
    attribute float kind;        // 0 sky, 1 star-bound
    uniform float uSize;         // ball radius, world units at dome radius
    uniform int   uShapeA;       // 0 dome, 1 sphere, 2 cube — the shape we are leaving
    uniform int   uShapeB;       // the shape we are arriving at
    uniform float uBlend;        // 0 = all A, 1 = all B
    uniform vec3  uVolCenter;    // where the volumetric shapes float
    uniform float uVolR;         // their half-size, metres
    varying vec3  vColor;
    varying vec3  vNormal;
    varying vec3  vView;
    varying float vGlow;

    vec3 spawn(float s, float cycle) {
      float h1 = hash1(s * 91.7 + cycle * 13.1);
      float h2 = hash1(s * 57.3 + cycle * 7.3 + 3.0);
      float y  = mix(-0.12, 1.0, h1);
      float az = h2 * 6.2831853;
      float r  = sqrt(max(0.0, 1.0 - y * y));
      return vec3(r * cos(az), y, r * sin(az));
    }
    // a point inside the unit ball or the unit cube
    vec3 spawnVol(float s, float cycle, int shape) {
      float h1 = hash1(s * 91.7 + cycle * 13.1);
      float h2 = hash1(s * 57.3 + cycle * 7.3 + 3.0);
      float h3 = hash1(s * 73.9 + cycle * 3.7 + 7.0);
      if (shape == 2) return vec3(h1 * 2.0 - 1.0, mix(-0.3, 1.0, h2), h3 * 2.0 - 1.0);
      float y = mix(-0.3, 1.0, h1), az = h2 * 6.2831853, r = sqrt(max(0.0, 1.0 - y * y));
      return vec3(r * cos(az), y, r * sin(az)) * pow(h3, 0.3333);
    }
    vec3 confine(vec3 p, int shape) {
      if (shape == 2) return clamp(p, -1.0, 1.0);                // grains pile up on the faces: the cube reads as a cube
      return p / max(1.0, length(p));
    }
    // the same vortex field, but filling a volume: falloff by distance from the axis line
    vec3 advectVol(vec3 p, float age, int shape) {
      for (int i = 0; i < ${MAXV}; i++) {
        if (i >= uVCount) break;
        vec3 ax = uVDir[i];
        vec4 P  = uVPar[i];
        float d = length(p - ax * dot(p, ax));
        float fall = exp(-d * d / (2.0 * P.y * P.y));
        float rot  = fall * P.z * (P.x * 0.55 * age + P.x * 0.25 * sin(P.w + age * 0.7));
        p = rotAxis(p, ax, rot);
      }
      p = rotAxis(p, vec3(0.0, 1.0, 0.0), age * 0.012);
      vec3 nz = vec3(noise3(p * 3.0 + 1.3), noise3(p * 3.0 + 7.1), noise3(p * 3.0 + 13.7)) - 0.5;
      return confine(p + nz * 0.05 * min(age, 4.0), shape);
    }
    vec3 turntable(vec3 p) { return rotAxis(p, vec3(0.0, 1.0, 0.0), uTime * 0.07); }

    // Where does a sky particle sit, for a given shape? World head/tail, radius, the shape's normal, colour field.
    void placeSky(int shape, float age, float cycle, float size, out vec3 hp, out vec3 tp, out float w, out vec3 nrm, out float maxLen, out float hfade, out float v) {
      if (shape == 0) {
        vec3 p0 = spawn(seed, cycle);
        vec3 head = advect(p0, age);
        vec3 tail = advect(p0, max(age - 0.12, 0.0));
        float R = ${DOME.toFixed(1)} * mix(0.55, 1.0, hash1(seed * 6.3));
        hp = head * R; tp = tail * R; w = size * R / ${DOME.toFixed(1)}; nrm = head;
        maxLen = R * 0.2; hfade = smoothstep(-0.16, -0.02, head.y); v = field(p0);
      } else {
        vec3 p0 = spawnVol(seed, cycle, shape);
        vec3 head = turntable(advectVol(p0, age, shape));
        vec3 tail = turntable(advectVol(p0, max(age - 0.12, 0.0), shape));
        hp = uVolCenter + head * uVolR; tp = uVolCenter + tail * uVolR;
        w = size * uVolR * 0.0065; nrm = normalize(head + vec3(0.0, 1e-4, 0.0));
        maxLen = uVolR * 0.3; hfade = 1.0; v = field(p0 * 1.6);
      }
    }
    void placeStar(int shape, vec3 head, vec3 tail, float size, out vec3 hp, out vec3 tp, out float w, out vec3 nrm, out float maxLen) {
      if (shape == 0) {
        float R = ${DOME.toFixed(1)} * mix(0.6, 0.95, hash1(seed * 6.3));
        hp = head * R; tp = tail * R; w = size * R / ${DOME.toFixed(1)}; nrm = head; maxLen = R * 0.2;
      } else {
        vec3 h = turntable(head), t = turntable(tail);
        float rr = uVolR * mix(0.45, 0.62, hash1(seed * 6.3));
        hp = uVolCenter + h * rr; tp = uVolCenter + t * rr;
        w = size * uVolR * 0.0055; nrm = h; maxLen = uVolR * 0.3;
      }
    }

    void main() {
      float life  = mix(4.0, 8.0, hash1(seed * 3.1));
      float u     = uTime / life + seed;
      float cycle = floor(u);
      float age   = fract(u) * life;
      float f     = fract(u);
      float e     = smoothstep(0.0, 1.0, uBlend);

      vec3 hp, tp, nrm, col;
      float w, maxLen, hfade, glow;

      if (kind < 0.5) {
        float size = uSize * (0.6 + 0.8 * hash1(seed * 4.4));
        float v;
        placeSky(uShapeA, age, cycle, size, hp, tp, w, nrm, maxLen, hfade, v);
        if (uBlend > 0.001) {
          vec3 hp2, tp2, nrm2; float w2, maxLen2, hfade2, v2;
          placeSky(uShapeB, age, cycle, size, hp2, tp2, w2, nrm2, maxLen2, hfade2, v2);
          hp = mix(hp, hp2, e); tp = mix(tp, tp2, e); w = mix(w, w2, e); nrm = normalize(mix(nrm, nrm2, e));
          maxLen = max(maxLen, maxLen2) * 4.0; hfade = mix(hfade, hfade2, e); v = mix(v, v2, e);
        }
        col = paint(v) * 1.15 + SKY * 0.25 * smoothstep(0.6, 1.0, v);
        col *= 0.8 + 0.4 * hash1(seed * 2.3);
        glow = mix(0.7, 1.7, smoothstep(0.3, 1.0, v));           // the bright paint carries the light
      } else {
        // pick a light (11 stars + the moon), settle at some distance around it, orbit it
        float pick = floor(hash1(seed * 17.9) * 12.0);
        vec3 c = uMoon; float sz = 0.085; float br = 1.2;
        for (int i = 0; i < ${NSTAR}; i++) { if (float(i) == pick) { c = uStar[i]; sz = uStarP[i].x; br = uStarP[i].y; } }
        float h1 = hash1(seed * 31.3 + cycle * 5.7), h2 = hash1(seed * 43.1 + cycle * 9.1);
        float rho = sz * (0.25 + 2.6 * pow(h1, 0.7));               // denser near the core
        float th  = h2 * 6.2831853;
        vec3 t1 = normalize(cross(c, abs(c.y) < 0.9 ? vec3(0.0, 1.0, 0.0) : vec3(1.0, 0.0, 0.0)));
        vec3 t2 = cross(c, t1);
        vec3 p0 = normalize(c + (t1 * cos(th) + t2 * sin(th)) * rho);
        float omega = 0.9 / (rho / sz + 0.35);                     // the inner ring turns faster
        vec3 head = advect(rotAxis(p0, c, omega * age), age * 0.25);
        vec3 tail = advect(rotAxis(p0, c, omega * max(age - 0.12, 0.0)), max(age - 0.12, 0.0) * 0.25);
        float close = 1.0 - clamp(rho / (sz * 2.9), 0.0, 1.0);
        col = mix(GOLD * 0.9, IVORY, close * close) * br;
        glow = mix(0.9, 2.2, close) * br;
        float size = uSize * (0.5 + 0.9 * hash1(seed * 4.4)) * mix(0.8, 1.4, close);
        placeStar(uShapeA, head, tail, size, hp, tp, w, nrm, maxLen);
        if (uBlend > 0.001) {
          vec3 hp2, tp2, nrm2; float w2, maxLen2;
          placeStar(uShapeB, head, tail, size, hp2, tp2, w2, nrm2, maxLen2);
          hp = mix(hp, hp2, e); tp = mix(tp, tp2, e); w = mix(w, w2, e); nrm = normalize(mix(nrm, nrm2, e));
          maxLen = max(maxLen, maxLen2) * 4.0;
        }
        hfade = smoothstep(-0.16, -0.02, head.y);
      }
      vColor = col;
      vGlow = glow;

      float fade = smoothstep(0.0, 0.12, f) * (1.0 - smoothstep(0.78, 1.0, f)) * hfade;

      vec3 seg = hp - tp;
      float len = length(seg);
      vec3 flow = len > 1e-5 ? seg / len : normalize(cross(nrm, vec3(0.0, 1.0, 0.0)) + vec3(1e-4, 0.0, 0.0));
      if (len > maxLen) fade = 0.0;
      vec3 sideRaw = cross(nrm, flow);
      vec3 side = length(sideRaw) > 1e-3 ? normalize(sideRaw) : normalize(cross(flow, vec3(0.0, 1.0, 0.01)));
      vec3 out_ = cross(flow, side);
      vec3 sc = vec3(w + len * 0.35, w, w) * fade;                 // a ball, stretched a little when it moves fast
      mat3 basis = mat3(flow, side, out_);
      vec3 wp = (hp + tp) * 0.5 + basis * (position * sc);
      vNormal = normalize(basis * (normal / max(sc, vec3(1e-4))));
      vView = -(modelViewMatrix * vec4(wp, 1.0)).xyz;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(wp, 1.0);
    }`;

  // Everything else in the scene — ground, hills, village, cypress — is a cloud of still particles.
  const sceneVert = `
    precision highp float;
    attribute vec3  ipos;
    attribute vec3  icol;
    attribute vec2  iparam;      // x radius, y glow
    attribute float seed;
    uniform float uTime;
    uniform float uLandMix;      // 0 = the land at true scale around you, 1 = a diorama inside the volume
    uniform vec3  uVolCenter;
    uniform float uVolR;
    varying vec3  vColor;
    varying vec3  vNormal;
    varying vec3  vView;
    varying float vGlow;
    // Fold 300 m of landscape into the volume: distance is compressed r/(r+40), so the cypress stays
    // near the middle, the village sits halfway out and the hills ring the rim.
    vec3 diorama(vec3 p) {
      float k = 40.0;
      float rr = length(p.xz);
      vec2 xz = p.xz / max(rr, 1e-3) * (uVolR * 0.92 * rr / (rr + k));
      float y = uVolR * 0.9 * (max(p.y, 0.0) / (max(p.y, 0.0) + k)) - uVolR * 0.55;
      vec3 q = vec3(xz.x, y, xz.y);
      float a = uTime * 0.07; float c = cos(a), sn = sin(a);            // same turntable as the sky
      q = vec3(q.x * c + q.z * sn, q.y, -q.x * sn + q.z * c);
      return uVolCenter + q;
    }
    void main() {
      // breathing: a slow wave that travels through each object, a sway that grows with height,
      // and a little per-grain flicker on top, so trees and houses feel alive without wandering
      float wave = sin(uTime * 0.7 + ipos.x * 0.18 + ipos.z * 0.14 + ipos.y * 0.45);
      float sway = sin(uTime * 0.45 + ipos.x * 0.05 + ipos.z * 0.05);
      float jit  = sin(uTime * (1.2 + seed * 1.6) + seed * 40.0);
      float amp  = iparam.x * 1.6;
      vec3 p = ipos
             + vec3(sway * ipos.y * 0.025, wave * amp * 0.9 + jit * amp * 0.35, sway * ipos.y * 0.012);
      float r = iparam.x * (0.85 + 0.2 * (0.5 + 0.5 * wave) + 0.08 * jit);
      if (uLandMix > 0.001) {
        float rv = (0.0011 + iparam.x * 0.0012) * (0.8 + 0.4 * seed) * uVolR * 1.6;
        p = mix(p, diorama(p), uLandMix);
        r = mix(r, rv, uLandMix);
      }
      vec3 wp = p + position * r;
      vNormal = normal;
      vColor = icol;
      vGlow = iparam.y;
      vec4 mv = modelViewMatrix * vec4(wp, 1.0);
      vView = -mv.xyz;
      gl_Position = projectionMatrix * mv;
    }`;

  const starDirs = [
    [ 0.18, 0.62, -0.76], [ 0.52, 0.48, -0.70], [-0.30, 0.55, -0.78], [-0.62, 0.40, -0.68],
    [ 0.80, 0.30, -0.52], [-0.05, 0.80, -0.60], [-0.85, 0.22, -0.48], [ 0.40, 0.20, -0.89],
    [ 0.62, 0.72,  0.31], [-0.55, 0.66,  0.51], [ 0.10, 0.45,  0.89]
  ].map(a => new THREE.Vector3(...a).normalize());
  const starParams = [
    [0.075, 1.15], [0.060, 1.0], [0.055, 0.95], [0.065, 1.05],
    [0.050, 0.9],  [0.045, 0.85], [0.052, 0.8], [0.040, 0.9],
    [0.058, 0.9],  [0.050, 0.85], [0.044, 0.8]
  ].map(a => new THREE.Vector2(a[0], a[1]));

  const shared = {
    uTime:   { value: 0 },
    uVDir:   { value: Array.from({ length: MAXV }, () => new THREE.Vector3(0, 1, 0)) },
    uVPar:   { value: Array.from({ length: MAXV }, () => new THREE.Vector4(0, 0.3, 1, 0)) },
    uVCount: { value: 0 },
    uStar:   { value: starDirs },
    uStarP:  { value: starParams },
    uMoon:   { value: new THREE.Vector3(0.82, 0.52, -0.25).normalize() }
  };

  const sky = new THREE.Mesh(
    new THREE.SphereGeometry(500, 48, 32),
    new THREE.ShaderMaterial({ uniforms: Object.assign({ uAlpha: { value: 1 } }, shared), vertexShader: skyVert, fragmentShader: skyFrag, side: THREE.BackSide, depthWrite: false, fog: false })
  );
  sky.frustumCulled = false;
  sky.renderOrder = -2;
  root.add(sky);

  const ballGeo = new THREE.SphereGeometry(1, 5, 3);
  const dabGeo = new THREE.InstancedBufferGeometry().copy(ballGeo);
  {
    const seeds = new Float32Array(N), kinds = new Float32Array(N);
    for (let i = 0; i < N; i++) { seeds[i] = (i + 0.5) / N; kinds[i] = i < N_SKY ? 0 : 1; }
    dabGeo.setAttribute('seed', new THREE.InstancedBufferAttribute(seeds, 1));
    dabGeo.setAttribute('kind', new THREE.InstancedBufferAttribute(kinds, 1));
    dabGeo.instanceCount = N;
  }
  const VOL_CENTER = new THREE.Vector3(0, 1.75, -2.1);
  const VOL_R = 0.62;
  const dabUniforms = Object.assign({
    uSize: { value: 1.35 },
    uShapeA: { value: 0 }, uShapeB: { value: 0 }, uBlend: { value: 0 },
    uVolCenter: { value: VOL_CENTER }, uVolR: { value: VOL_R }
  }, shared);
  const dabs = new THREE.Mesh(dabGeo, new THREE.ShaderMaterial({ uniforms: dabUniforms, vertexShader: dabVert, fragmentShader: glowFrag, fog: false }));
  dabs.frustumCulled = false;
  root.add(dabs);

  /* ---------- vortices ---------- */
  const builtin = [
    { dir: new THREE.Vector3( 0.30, 0.50, -0.81).normalize(), strength: 1.25, radius: 0.48, sign:  1, phase: 0.0 },
    { dir: new THREE.Vector3(-0.60, 0.36, -0.72).normalize(), strength: 0.85, radius: 0.32, sign: -1, phase: 2.1 },
    { dir: new THREE.Vector3( 0.55, 0.42,  0.72).normalize(), strength: 0.70, radius: 0.38, sign:  1, phase: 4.0 }
  ];
  const userVortices = [];

  function beginVortex(dir, sign) {
    const v = { dir: dir.clone().normalize(), strength: 0.05, radius: 0.26, sign: sign || 1, phase: Math.random() * 6.28, held: true };
    userVortices.push(v);
    while (userVortices.length > MAXV - builtin.length) userVortices.shift();
    return v;
  }
  function updateVortices(dt, time) {
    for (let i = userVortices.length - 1; i >= 0; i--) {
      const v = userVortices[i];
      if (v.held) {
        v.strength = Math.min(2.4, v.strength + dt * 1.0);
        v.radius   = Math.min(0.42, v.radius + dt * 0.05);
        v.phase   += dt * 3.0;
      } else {
        v.strength *= Math.exp(-dt / 7.0);
        v.phase   += dt * 0.6;
        if (v.strength < 0.02) { userVortices.splice(i, 1); continue; }
      }
    }
    const all = builtin.concat(userVortices);
    shared.uVCount.value = all.length;
    for (let i = 0; i < all.length; i++) {
      const v = all[i];
      shared.uVDir.value[i].copy(v.dir);
      const ph = v.held !== undefined ? v.phase : time * 0.45 + v.phase;
      shared.uVPar.value[i].set(v.strength, v.radius, v.sign, ph);
    }
  }

  /* ---------- the land, as particles ---------- */
  const cloud = { pos: [], col: [], par: [], seed: [] };
  const C = new THREE.Color();
  const rnd = (a, b) => a + Math.random() * (b - a);
  function drop(x, y, z, hex, radius, glow, jitter) {
    C.setHex(hex);
    const j = 0.82 + Math.random() * 0.36;                 // no two grains the same value
    cloud.pos.push(x, y, z);
    cloud.col.push(C.r * j, C.g * j, C.b * j);
    cloud.par.push(radius * rnd(0.7, 1.3), glow * rnd(0.8, 1.2));
    cloud.seed.push(Math.random());
  }
  // ground: a dark meadow that thins with distance
  for (let i = 0; i < 7000; i++) {
    const r = 3 + 320 * Math.pow(Math.random(), 1.6), a = Math.random() * Math.PI * 2;
    drop(Math.cos(a) * r, 0.05 + Math.random() * 0.25, Math.sin(a) * r, i % 7 === 0 ? 0x3a6bc4 : 0x1c3f8f, 0.07 + r * 0.009, 0.5, 0);
  }
  // hills: grains on the upper skin of each ellipsoid
  [[-140, 0, -230, 190, 26, 70], [60, 0, -260, 240, 34, 90], [200, 0, -190, 150, 18, 60],
   [-260, 0, -120, 160, 22, 60], [120, 0, 220, 220, 30, 90], [-150, 0, 260, 200, 24, 80]].forEach(h => {
    for (let i = 0; i < 1400; i++) {
      const a = Math.random() * Math.PI * 2, e = Math.acos(Math.random());  // upper hemisphere
      const x = Math.cos(a) * Math.sin(e), y = Math.cos(e), z = Math.sin(a) * Math.sin(e);
      drop(h[0] + x * h[3], y * h[4] + 0.3, h[2] + z * h[5], y > 0.85 ? 0x4a7fc8 : 0x24509e, 1.0 + h[3] * 0.004, 0.65, 0);
    }
  });
  // village: walls, roofs, and lit windows
  [[-22, -95, 4, 3.5], [-12, -100, 5, 4], [-2, -96, 4.5, 3.6], [8, -102, 6, 4.2], [18, -97, 4, 3.4], [30, -104, 5, 3.8], [-34, -104, 4.6, 3.2]].forEach(h => {
    const [cx, cz, w, ht] = h, d = w * 0.8;
    for (let i = 0; i < 260; i++) {
      const face = Math.floor(Math.random() * 4);
      const u = Math.random() - 0.5, v = Math.random();
      const x = face < 2 ? cx + (face === 0 ? -w / 2 : w / 2) : cx + u * w;
      const z = face < 2 ? cz + u * d : cz + (face === 2 ? -d / 2 : d / 2);
      drop(x, v * ht, z, Math.random() < 0.2 ? 0x8a7a5a : 0x3e5aa6, 0.18, 0.9, 0);
    }
    for (let i = 0; i < 120; i++) {                        // roof: a squat pyramid
      const v = Math.random(), a = Math.random() * Math.PI * 2, rr = (1 - v) * w * 0.75;
      drop(cx + Math.cos(a) * rr, ht + v * ht * 0.6, cz + Math.sin(a) * rr, 0x6a5a8a, 0.18, 0.9, 0);
    }
    for (let k = 0; k < 2; k++) for (let i = 0; i < 6; i++) // windows: warm grains, brighter
      drop(cx - w * 0.25 + k * w * 0.5 + rnd(-0.25, 0.25), ht * 0.45 + rnd(-0.3, 0.3), cz + d / 2 + 0.12, 0xf6d76b, 0.15, 3.0, 0);
  });
  for (let i = 0; i < 400; i++) {                          // church and spire
    const v = Math.random(), a = Math.random() * Math.PI * 2;

// ── Brushstroke shader ───────────────────────────────────────────
const vsStroke = `
  attribute vec3 iPos; attribute vec3 iCol; attribute vec2 iSize;
  attribute float iRot; attribute float iAlpha; attribute float iSeed;
  uniform float uHemiFade;
  varying vec2 vUv; varying vec3 vCol; varying float vAlpha; varying float vSeed;
  void main() {
    vUv = position.xy; vCol = iCol; vSeed = iSeed;
    vec4 c = modelViewMatrix * vec4(iPos, 1.0);
    float cs = cos(iRot), sn = sin(iRot);
    float s = length(modelMatrix[0].xyz);
    vec2 off = vec2(position.x * iSize.x, position.y * iSize.y) * s;
    off = vec2(off.x * cs - off.y * sn, off.x * sn + off.y * cs);

  void main() {

    float edge = 1.0 - 0.28 * n;
    float a = 1.0 - smoothstep(edge * 0.30, edge, d);

    float streak = 0.97 + 0.03 * sin((vUv.x * 9.0 + vSeed) * 3.14159);
    float ends = 1.0 - 0.12 * smoothstep(0.55, 1.0, abs(q.x));

class StrokeLayer {

{

// Cube backdrops: back wall gradient, box floor, frame edges

        if (MODE === 'immersive' && h.pos.y > 0.9) continue;
        const f = handForce(water, i, h.local, h.localVel, rSweep, 2.6 * kF, 1.8, dt);
        if (f > 0) {
          water.vel[i3 + 1] += f * 0.9 * kF * dt;
          water.rot[i] += (Math.random() - 0.5) * f * 0.25;
          water.col[i3] = Math.min(1, water.col[i3] + f * 0.06); water.col[i3 + 1] = Math.min(1, water.col[i3 + 1] + f * 0.04);
        }
      }
    }
    springBack(water, i, 6.0, 0.93, dt);
    if (water.pos[i3 + 1] < WATER_Y) { water.pos[i3 + 1] = WATER_Y; water.vel[i3 + 1] *= -0.3; }
    const lift = energy * 0.10;
    water.col[i3] += (water.base[i3] + lift - water.col[i3]) * 0.03;
    water.col[i3 + 1] += (water.base[i3 + 1] + lift * 0.7 - water.col[i3 + 1]) * 0.03;
    water.col[i3 + 2] += (water.base[i3 + 2] - water.col[i3 + 2]) * 0.03;
  }
  water.flush();

  // ── Reflection column ──
  for (let i = 0; i < REF_N; i++) {
    if (refl.regionMask[i] === 0) continue;
    const i3 = i * 3, ph = refl.phase[i], z = refl.home[i3 + 2];
    const centerX = (-z) * Math.tan(SUN_AZ) + Math.sin(t * 1.3 + ph + z * 0.4) * 0.12 * amp;
    refl.home[i3] += (centerX + (refl.seed[i] % 1 - 0.5) * 2.0 * (0.35 + (1 - z / -R) * 1.4) - refl.home[i3]) * 0.02;
    refl.home[i3 + 1] = WATER_Y + 0.035 + Math.sin(t * 1.1 + ph) * 0.012 * amp;
    refl.alpha[i] = Math.min(1, refl.baseAlpha[i] * (0.9 + (sunElev - 0.06) * 0.6 + energy * 0.15));
    for (const h of paintHands) {
      if (h.pinch > 0.6) {
        const f = pinchForce(refl, i, h, rStir * 1.15, 16 * kF * h.pinch, 3.0 * kF, dt);
        if (f > 0) { refl.col[i3] = Math.min(1, refl.col[i3] + f * 0.06); refl.col[i3 + 1] = Math.min(1, refl.col[i3 + 1] + f * 0.04); }
      } else {
        if (MODE === 'immersive' && h.pos.y > 1.1) continue;
        handForce(refl, i, h.local, h.localVel, rSweep * 0.8, 2.0 * kF, 1.5, dt);
      }
    }
    springBack(refl, i, 5.0, 0.92, dt);
    if (refl.pos[i3 + 1] < WATER_Y + 0.01) { refl.pos[i3 + 1] = WATER_Y + 0.01; refl.vel[i3 + 1] *= -0.2; }
    refl.col[i3] += (refl.base[i3] - refl.col[i3]) * 0.03;
    refl.col[i3 + 1] += (refl.base[i3 + 1] - refl.col[i3 + 1]) * 0.03;
    refl.col[i3 + 2] += (refl.base[i3 + 2] - refl.col[i3 + 2]) * 0.03;
  }
  refl.flush();

  // ── Silhouettes ──
  for (let i = 0; i < SIL_N; i++) {
    const i3 = i * 3;
    if (sil.alpha[i] === 0) continue;
    const near = Math.hypot(sil.home[i3], sil.home[i3 + 2]) < 30;
    sil.pos[i3 + 1] = sil.home[i3 + 1] + (near ? Math.sin(t * 0.8 + sil.home[i3 + 2] * 0.5) * 0.02 * amp : 0);
    sil.rot[i] = sil.rotHome[i] + (near ? Math.sin(t * 0.8 + sil.home[i3 + 2] * 0.5 + 1) * 0.03 * amp : 0);
  }
  sil.flush();

  // ── the boats ride the swell ──
  for (const b of SHIPS) {
    const ph = b.userData.bob, hm = b.userData.home;
    b.position.y = hm.y + Math.sin(t * 0.9 + ph) * 0.05 * amp;
    b.position.x = hm.x + Math.sin(t * 0.35 + ph) * 0.05 * amp;
    b.rotation.z = Math.sin(t * 0.7 + ph) * 0.02 * amp;
  }

  // ── Mist motes ──
  if (FX.mist) {
    for (let i = 0; i < MIST_N; i++) {
      if (mist.regionMask[i] === 0) continue;
      const i3 = i * 3, ph = mist.phase[i];
      mist.home[i3] += Math.sin(t * 0.3 + ph) * 0.002 * amp;
      mist.home[i3 + 1] += Math.cos(t * 0.23 + ph) * 0.0015 * amp;
      mist.rot[i] += 0.002 * timeScale;
      for (const h of paintHands) {
        if (h.pinch > 0.6) pinchForce(mist, i, h, rStir * 1.2, 10 * kF, 2.0 * kF, dt);
        else handForce(mist, i, h.local, h.localVel, rSweep, 2.2 * kF, 1.2, dt);
      }
      springBack(mist, i, 1.2, 0.95, dt);
      mist.alpha[i] = 0.12 + Math.sin(t * 0.8 + ph) * 0.05 + energy * 0.08;
    }
    mist.flush();
  }

  for (const s of ['left', 'right']) {
    const h = hands[s], d = pinchDots[s];
    d.visible = h.active && !h.grabbing && !h.palmUp;
    if (d.visible) { d.position.copy(h.pinchPt); d.scale.setScalar(0.35 + h.pinch * 1.0 + energy * 0.6); d.material.opacity = 0.35 + h.pinch * 0.6; }
    h.prevPinch = h.pinch; h.wasActive = h.active;
  }
}

  // ── hands, read from the framework's input sources ──────────────────────
  const mkHand = (side) => ({
    side,
    pos: new THREE.Vector3(), prev: new THREE.Vector3(), vel: new THREE.Vector3(),
    pinchPt: new THREE.Vector3(), indexTip: new THREE.Vector3(), palmN: new THREE.Vector3(0, 1, 0),
    local: new THREE.Vector3(), localVel: new THREE.Vector3(), localPinch: new THREE.Vector3(),
    pinch: 0, prevPinch: 0, active: false, wasActive: false,
    grabbing: false, nearGlass: false, inside: false, palmUp: false,
    grabOffset: new THREE.Vector3()
  });
  const hands = { left: mkHand("left"), right: mkHand("right") };
  const _rp = new THREE.Vector3(), _rl = new THREE.Vector3();
  // is this point in the paint already? (the widget's volume, or the sea in front of you)
  function withinPaint(p) {
    if (isWidget()) return p.distanceTo(globePose.pos) < R * GLOBE_SCALE * globePose.scale * 1.05;
    return p.y < 1.9;
  }
  // where a ray lands in the painting: the water sheet when you are inside it,
  // the heart of the widget when you are holding it at arm's length
  function rayTarget(src) {
    const o = src.ray.origin, d = src.ray.dir;
    if (isWidget()) {
      _rl.copy(globePose.pos).sub(o);
      const t = _rl.dot(d);
      if (t < 0.05) return null;
      const rad = R * GLOBE_SCALE * globePose.scale;
      _rp.copy(o).addScaledVector(d, t);                    // closest approach: inside the glass
      if (_rp.distanceTo(globePose.pos) > rad) return null;
      return _rp;
    }
    if (d.y > -0.02) return null;
    const t = -(o.y - WATER_Y) / d.y;
    if (t < 0.2 || t > R * 1.5) return null;
    return _rp.copy(o).addScaledVector(d, t);
  }
  // a hand, a controller or the mouse — all of them can stir paint and carry the globe
  function readHands(dt) {
    for (const s of ["left", "right"]) { hands[s].prev.copy(hands[s].pos); hands[s].active = false; }
    for (const g of app.im.groups.values()) {
      const src = g.source;
      const h = hands[src.handedness === "left" ? "left" : "right"];
      if (h.active) continue;
      if (g.list.some((i) => i.selecting)) continue;        // the framework is carrying something with it
      let p = null, pinch = 0, tip = null, palm = null, palmUp = false;
      if (src.kind === "hand" && src.tracked) {
        p = src.pinchPoint; tip = src.pokePoint; palm = src.palmNormal; pinch = src.pinchValue; palmUp = src.palmFacingHead;
        h.pos.copy(src.palmCenter);
      } else if (src.kind === "controller" && src.tracked) {
        p = src.nearPoint; tip = src.pokePoint; pinch = Math.max(src.selectValue || 0, src.select ? 1 : 0);
        h.pos.copy(src.nearPoint);
      } else if (src.ray.valid) {
        pinch = src.select ? 1 : 0;
      }
      // out of arm's reach? then the ray carries the hand to where it lands
      if (!p || (pinch > 0.05 && !withinPaint(p))) {
        const hit = src.ray.valid && pinch > 0.05 ? rayTarget(src) : null;
        if (hit) { p = hit; tip = hit; h.pos.copy(hit); }
        else if (!p) continue;
      }
      h.active = true;
      h.pinchPt.copy(p);
      h.indexTip.copy(tip || p);
      if (palm) h.palmN.copy(palm).negate(); else h.palmN.set(0, 1, 0);
      h.pinch = pinch; h.palmUp = palmUp;
      if (!h.wasActive) h.prev.copy(h.pos);
      h.vel.copy(h.pos).sub(h.prev).divideScalar(Math.max(dt, 1e-3));
    }
  }

  function recentreGlobe() {
    const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(CAM.quaternion); fwd.y = 0; fwd.normalize();
    globePose.pos.copy(CAM.position).add(fwd.multiplyScalar(0.6)); globePose.pos.y = CAM.position.y - 0.45;
    globePose.yaw = Math.atan2(fwd.x, fwd.z) + Math.PI; globePose.scale = 1;
    if (isWidget()) applyMode();
  }
  function setMode(m) { MODE = m; if (isWidget()) recentreGlobe(); applyMode(); }
  function setPinch(v) { FX.pinch = v; onModeChanged(); }
  function toggleFX(k) {
    FX[k] = !FX[k];
    if (k === "sunUp") sunElevTarget = FX.sunUp ? 0.42 : 0.155;
    if (k === "mist") { mist.mesh.visible = FX.mist; }
    onModeChanged();
  }
  // the pinch dots the original draws at each pinch point
  const pinchDots = {};
  for (const s of ["left", "right"]) {
    const d = new THREE.Mesh(new THREE.SphereGeometry(0.008, 12, 10), new THREE.MeshBasicMaterial({ color: 0xff4d1c, transparent: true, opacity: 0.9 }));
    d.renderOrder = 9; d.visible = false; d.userData.noCollider = true; root.add(d); pinchDots[s] = d;
  }

  applyMode();
  recentreGlobe();
  return {
    world, hands, update(dt, now) { readHands(dt); update(dt, now); },
    setMode, setPinch, toggleFX, recentreGlobe, applyMode,
    get mode() { return MODE; }, FX,
    onMode(fn) { onModeChanged = fn; },
    isWidget, glass, ships: SHIPS, globePose, R, GLOBE_SCALE,
    setHandleHot(v) { handleHot = v; },
    setPose(pos, scale, yaw) { globePose.pos.copy(pos); globePose.scale = scale; globePose.yaw = yaw; },
    N: SKY_N + WATER_N + REF_N + SIL_N + MIST_N
  };
}

// ============================================================================
// src/art/qianli-jiangshan.js — "A Thousand Li of Rivers and Mountains"
// (千里江山圖, after Wang Ximeng, 1113 — public domain), an original reading of
// the handscroll: malachite and azurite ranges built from brush strokes, silk
// sky, a river of pale jade, and the mist you can sweep with your hand.
// Three ways to hold it: Immersive (you stand on the shore), Globe (a bowl in
// your hands) and Scroll (the ranges unrolled into a band in front of you).
// ============================================================================
function buildQianli(THREE, root, app) {
  const CAM = app.camera;
  const world = new THREE.Group();
  root.add(world);
  let MODE = "scroll";
  let onModeChanged = () => {};

  const C = (h) => new THREE.Color(h);
  const PAL = {
    malachite: [C(0x2f6b4f), C(0x3c8361), C(0x54a075), C(0x1f5140)],
    azurite: [C(0x24597a), C(0x2e6e92), C(0x3f86a6), C(0x1b4460)],
    silk: [C(0xd9c79c), C(0xcbb587), C(0xe3d4ad)],
    ink: [C(0x2a2620), C(0x3a3428)],
    gold: [C(0xe6cf92), C(0xd8b56a)],
    water: [C(0x8fb0ae), C(0xa7c4bd), C(0x77999b), C(0xbcd2c8)],
    mist: [C(0xeef0e6), C(0xdfe4d8)]
  };
  const pick = (a) => a[(Math.random() * a.length) | 0];
  const rnd = (a, b) => a + Math.random() * (b - a);

  const R = 230;                      // painting units: the ranges stand 30-210 out
  const GLOBE_SCALE = 0.8 / (R * 2);
  const SCROLL_SCALE = 1.7 / 430;            // the band reads about 1.7 m wide
  const SCROLL_STRETCH = 1.45;                // and stands up, the way a scroll is read
  const globePose = { pos: new THREE.Vector3(0, 1.05, -0.6), yaw: 0, scale: 1 };
  const isWidget = () => MODE !== "immersive";

  // ── a brush-stroke layer: instanced quads that always face you ───────────
  const vs = `
    attribute vec3 iPos; attribute vec3 iCol; attribute vec2 iSize;
    attribute float iRot; attribute float iAlpha;
    varying vec2 vUv; varying vec3 vCol; varying float vAlpha;
    void main() {
      vUv = position.xy; vCol = iCol; vAlpha = iAlpha;
      vec4 c = modelViewMatrix * vec4(iPos, 1.0);
      float s = length(modelMatrix[0].xyz);
      float cs = cos(iRot), sn = sin(iRot);
      vec2 off = vec2(position.x * iSize.x, position.y * iSize.y) * s;
      c.xy += vec2(off.x * cs - off.y * sn, off.x * sn + off.y * cs);
      gl_Position = projectionMatrix * c;
    }`;
  const fs = `
    precision highp float;
    varying vec2 vUv; varying vec3 vCol; varying float vAlpha;
    void main() {
      vec2 q = vUv * 2.0;
      float d = dot(q, q);
      float a = 1.0 - smoothstep(0.35, 1.0, d);
      if (a * vAlpha < 0.01) discard;
      gl_FragColor = vec4(vCol, a * vAlpha);
    }`;
  function layer(count, { renderOrder = 0, depthWrite = false, depthTest = true } = {}) {
    const L = {
      n: count,
      home: new Float32Array(count * 3), pos: new Float32Array(count * 3), vel: new Float32Array(count * 3),
      col: new Float32Array(count * 3), size: new Float32Array(count * 2),
      rot: new Float32Array(count), alpha: new Float32Array(count), baseAlpha: new Float32Array(count),
      phase: new Float32Array(count)
    };
    const g = new THREE.InstancedBufferGeometry();
    const quad = new THREE.PlaneGeometry(1, 1);
    g.index = quad.index; g.setAttribute("position", quad.getAttribute("position"));
    const A = (arr, n) => new THREE.InstancedBufferAttribute(arr, n).setUsage(THREE.DynamicDrawUsage);
    L.aPos = A(L.pos, 3); L.aCol = A(L.col, 3); L.aSize = A(L.size, 2); L.aRot = A(L.rot, 1); L.aAlpha = A(L.alpha, 1);
    g.setAttribute("iPos", L.aPos); g.setAttribute("iCol", L.aCol); g.setAttribute("iSize", L.aSize);
    g.setAttribute("iRot", L.aRot); g.setAttribute("iAlpha", L.aAlpha);
    g.instanceCount = count;
    L.mesh = new THREE.Mesh(g, new THREE.ShaderMaterial({
      vertexShader: vs, fragmentShader: fs, transparent: true, depthWrite, depthTest, side: THREE.DoubleSide
    }));
    L.mesh.frustumCulled = false; L.mesh.renderOrder = renderOrder; L.mesh.userData.noCollider = true;
    world.add(L.mesh);
    L.set = (i, x, y, z, color, w, h, rot, alpha) => {
      const i3 = i * 3;
      L.home[i3] = L.pos[i3] = x; L.home[i3 + 1] = L.pos[i3 + 1] = y; L.home[i3 + 2] = L.pos[i3 + 2] = z;
      L.vel[i3] = L.vel[i3 + 1] = L.vel[i3 + 2] = 0;
      L.col[i3] = color.r; L.col[i3 + 1] = color.g; L.col[i3 + 2] = color.b;
      L.size[i * 2] = w; L.size[i * 2 + 1] = h;
      L.rot[i] = rot; L.alpha[i] = L.baseAlpha[i] = alpha;
      L.phase[i] = Math.random() * 6.283;
    };
    L.flush = (all) => {
      L.aPos.needsUpdate = L.aCol.needsUpdate = L.aRot.needsUpdate = L.aAlpha.needsUpdate = true;
      if (all) L.aSize.needsUpdate = true;
    };
    return L;
  }

  // ── the silk sky and the river ──────────────────────────────────────────
  const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { uAlpha: { value: 1 } },
    vertexShader: `varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader: `
      precision highp float;
      uniform float uAlpha; varying vec3 vP;
      void main(){
        vec3 d = normalize(vP);
        vec3 low = vec3(0.855, 0.788, 0.627);        // aged silk at the horizon
        vec3 mid = vec3(0.780, 0.745, 0.627);
        vec3 high = vec3(0.671, 0.678, 0.596);
        vec3 c = mix(low, mid, smoothstep(-0.02, 0.25, d.y));
        c = mix(c, high, smoothstep(0.25, 0.85, d.y));
        gl_FragColor = vec4(c, uAlpha);
      }`
  });
  const skyDome = new THREE.Mesh(new THREE.SphereGeometry(R * 1.5, 40, 20, 0, Math.PI * 2, 0, Math.PI * 0.55), skyMat);
  skyDome.renderOrder = -10; skyDome.userData.noCollider = true; world.add(skyDome);

  const waterMat = new THREE.ShaderMaterial({
    depthWrite: false, fog: false, transparent: true,
    uniforms: { uAlpha: { value: 1 } },
    vertexShader: `varying vec2 vL; void main(){ vL = position.xy; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
    fragmentShader: `
      precision highp float;
      uniform float uAlpha; varying vec2 vL;
      void main(){
        float f = clamp(length(vL) / 220.0, 0.0, 1.0);
        vec3 near = vec3(0.435, 0.565, 0.557), far = vec3(0.745, 0.788, 0.706);
        gl_FragColor = vec4(mix(near, far, pow(f, 0.7)), uAlpha);
      }`
  });
  const river = new THREE.Mesh(new THREE.CircleGeometry(R * 1.4, 72), waterMat);
  river.rotation.x = -Math.PI / 2; river.position.y = -0.03; river.renderOrder = -9;
  river.userData.noCollider = true; world.add(river);

  // the glass dome and its lip, for the modes you hold
  const glass = new THREE.Mesh(new THREE.SphereGeometry(R * 0.72, 48, 24, 0, Math.PI * 2, 0, Math.PI * 0.5), new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, side: THREE.FrontSide, fog: false,
    uniforms: { uGlow: { value: 0 } },
    vertexShader: `varying vec3 vN; varying vec3 vV; void main(){ vec4 mv = modelViewMatrix*vec4(position,1.0); vN = normalize(normalMatrix*normal); vV = -mv.xyz; gl_Position = projectionMatrix*mv; }`,
    fragmentShader: `
      precision highp float;
      varying vec3 vN; varying vec3 vV; uniform float uGlow;
      void main(){
        float fr = pow(1.0 - max(0.0, dot(normalize(vN), normalize(vV))), 3.0);
        vec3 col = mix(vec3(0.88, 0.92, 0.86), vec3(0.95, 0.83, 0.55), uGlow);
        gl_FragColor = vec4(col, 0.04 + fr * (0.4 + uGlow * 0.4));
      }`
  }));
  glass.renderOrder = 12; glass.userData.noCollider = true; world.add(glass);
  const lip = new THREE.Mesh(new THREE.TorusGeometry(R * 0.73, 2.4, 8, 56), new THREE.MeshBasicMaterial({ color: 0xc9b58a, fog: false }));
  lip.rotation.x = Math.PI / 2; lip.position.y = 0.05; lip.userData.noCollider = true; world.add(lip);

  // the silk the scroll is painted on
  const paper = new THREE.Mesh(new THREE.PlaneGeometry(620, 190), new THREE.MeshBasicMaterial({ color: 0xd9c79c, fog: false }));
  paper.position.set(0, 38, -150); paper.renderOrder = -11; paper.userData.noCollider = true;
  paper.visible = false; world.add(paper);

  // ── the ranges ──────────────────────────────────────────────────────────
  // Each range is a chain of peaks; strokes fill the silhouette, greener at the
  // foot and bluer at the summit, and paler the further back it stands.
  const MTN_N = 18000, MIST_N = 600, TREE_N = 2600, WAVE_N = 3000;
  const mtn = layer(MTN_N, { renderOrder: 3 });
  const trees = layer(TREE_N, { renderOrder: 4 });
  const mist = layer(MIST_N, { renderOrder: 5 });
  const waves = layer(WAVE_N, { renderOrder: 2 });
  // distance, peak height, number of peaks, half-width in radians
  const RANGES = [
    { d: 30, h: 13, n: 3, w: 0.5 }, { d: 55, h: 24, n: 4, w: 0.75 }, { d: 88, h: 38, n: 5, w: 1.0 },
    { d: 125, h: 50, n: 5, w: 1.25 }, { d: 165, h: 56, n: 6, w: 1.5 }, { d: 205, h: 54, n: 7, w: 1.75 }
  ];
  const _pt = new THREE.Vector3();
  // In the scroll the ranges are not around you, they run along the silk: each
  // one is spread across the whole width, the way a handscroll overlaps them.
  function place(az, dist, y, spread) {
    if (MODE === "scroll") return _pt.set((az / (spread || 1.75)) * 205, y, -40 - dist * 0.45);
    return _pt.set(Math.sin(az) * dist, y, -Math.cos(az) * dist);
  }
  function ridge(az, k, peaks, spread) {                     // 0..1 profile of a range
    let v = 0;
    for (let p = 0; p < peaks; p++) {
      const c = -spread + (p + 0.5) * (2 * spread / peaks) + Math.sin(p * 9.3 + k) * 0.08;
      const w = spread / peaks * (0.7 + 0.5 * Math.abs(Math.sin(p * 4.7 + k)));
      const a = 0.5 + 0.5 * Math.abs(Math.sin(p * 2.9 + k * 1.7));
      v = Math.max(v, a * Math.exp(-Math.pow((az - c) / w, 2) * 1.5));
    }
    return v;
  }
  const RANGE_W = [0.26, 0.2, 0.16, 0.14, 0.12, 0.12];
  function buildMountains() {
    let i = 0;
    RANGES.forEach((rg, ri) => {
      const per = Math.floor(MTN_N * RANGE_W[ri]);
      const fade = ri / (RANGES.length - 1);                 // aerial perspective
      const sc = rg.d / 46;                                  // strokes keep their apparent size
      for (let k = 0; k < per && i < MTN_N; k++, i++) {
        const az = rnd(-rg.w, rg.w);
        const prof = ridge(az, ri * 3.1, rg.n, rg.w);
        if (prof < 0.05) { mtn.set(i, 0, -999, 0, PAL.ink[0], 0.01, 0.01, 0, 0); continue; }
        const top = prof * rg.h;
        const y = Math.pow(Math.random(), 0.7) * top;         // denser at the foot
        const hi = y / Math.max(top, 1e-3);
        const p = place(az + rnd(-0.02, 0.02), rg.d + rnd(-4, 4) * (1 + ri), y + 0.3, rg.w);

var QIANLI_PREVIEW_GLSL = `
    vec3 art(vec3 p0, vec3 n, float t) {
      vec3 SILK = vec3(0.855, 0.788, 0.627);
      vec3 SILK2 = vec3(0.741, 0.722, 0.608);
      vec3 MAL = vec3(0.129, 0.384, 0.263);
      vec3 MAL2 = vec3(0.278, 0.596, 0.396);
      vec3 AZ = vec3(0.075, 0.243, 0.384);
      vec3 AZ2 = vec3(0.145, 0.392, 0.545);
      vec3 WATER = vec3(0.318, 0.494, 0.478);
      vec3 GOLD = vec3(0.902, 0.812, 0.573);
      float az = atan(n.x, n.z);
      float el = n.y;
      vec3 col = mix(SILK, SILK2, smoothstep(0.0, 0.9, el));           // silk ground
      col *= 0.97 + 0.05 * fbm(vec3(n.x * 7.0, n.y * 7.0, n.z * 7.0));
      // four ranges: the far ones sit high and pale, the near ones low and deep
      for (int k = 0; k < 4; k++) {
        float fk = float(k);
        float far = 1.0 - fk / 3.0;                                    // 1 = furthest
        float ph = fk * 2.3;
        float base = 0.40 - fk * 0.115;
        float amp = 0.20 - fk * 0.035;
        float ridge = base
          + amp * (0.62 * sin(az * (1.6 + fk * 0.8) + ph) + 0.30 * sin(az * (3.7 + fk) - ph * 1.4)
                 + 0.18 * sin(az * (7.0 + fk * 2.0) + ph * 0.7))
          + 0.035 * fbm(vec3(az * 2.5 + ph, fk, 0.0));
        float m = smoothstep(ridge + 0.010, ridge - 0.010, el);        // below the ridge is rock
        float band = clamp((ridge - el) / (0.34 - fk * 0.05), 0.0, 1.0);  // summit to foot
        vec3 rock = mix(AZ, MAL, smoothstep(0.1, 0.75, band));
        rock = mix(rock, band > 0.5 ? MAL2 : AZ2, 0.4 * fbm(vec3(n.x * 18.0, n.y * 18.0, n.z * 18.0)));
        rock = mix(rock, SILK, 0.24 * far);                            // aerial distance
        col = mix(col, rock, m);
        float rim = smoothstep(0.016, 0.0, abs(el - ridge)) * (1.0 - far * 0.7);
        col = mix(col, GOLD, rim * 0.55);
        col = mix(col, vec3(0.925, 0.937, 0.898), smoothstep(0.04, 0.0, el - ridge + 0.05) * m * 0.10);  // mist at the foot
      }
      // the river: jade, with the pale strokes of the current
      float w = smoothstep(-0.14, -0.30, el);
      vec3 water = mix(WATER, vec3(0.463, 0.600, 0.573), 0.4 + 0.35 * sin(az * 2.0));
      water *= 0.93 + 0.10 * sin(el * 120.0 + fbm(vec3(n.x * 4.0, 0.0, n.z * 4.0)) * 7.0);
      col = mix(col, water, w);
      col = mix(col, vec3(0.918, 0.925, 0.878), smoothstep(-0.02, -0.10, el) * 0.10);
      return col;
    }`;

var ART = [
  { id: "starry-night", title: "The Starry Night", byline: "after Vincent van Gogh, 1889", glsl: STARRY_PREVIEW_GLSL },
  { id: "impression-sunrise", title: "Impression, Sunrise", byline: "after Claude Monet, Le Havre 1872", glsl: MONET_PREVIEW_GLSL },
  { id: "qianli-jiangshan", title: "Rivers and Mountains", byline: "\u5343\u91cc\u6c5f\u5c71\u5716 \u00b7 after Wang Ximeng, 1113", glsl: QIANLI_PREVIEW_GLSL }
];

// ---------------------------------------------------------------------------
// The hand menu belongs to the world you are in: it shows that world's own
// controls, and the framework's settings sit one tap away behind "Settings".
// ---------------------------------------------------------------------------
function navButtons(app) {
  if (app._nav) return app._nav;
  const b = (label, onClick) => new UIButton(app.im, label, { w: 0.075, h: 0.026, fontSize: 24, onClick });
  app._nav = {
    home: b("\u2190 Gallery", () => app.worlds.load("gallery")),
    settings: b("Settings \u2026", () => showMenuPage(app, "system")),
    back: b("\u2190 Back", () => showMenuPage(app, "world"))
  };
  return app._nav;
}

function setWorldMenu(app, world, ctx) {
  if (!app._baseMenu) app._baseMenu = app.menu.items.filter((i) => i !== app.opacitySlider);
  app._world = world; app._worldCtx = ctx;
  try { app._worldItems = (world && world.menuItems) ? (world.menuItems(ctx) || []) : []; }
  catch (e) { console.error(e); app._worldItems = []; }
  showMenuPage(app, "world");
}

function showMenuPage(app, page) {
  const menu = app.menu, nav = navButtons(app), world = app._world;
  const inGallery = !world || world.id === "gallery";
  let items, slider = null, title;
  if (page === "system") {
    items = app._baseMenu.filter((i) => i !== app.menuButtons.home).concat([nav.back]);
    slider = app.opacitySlider;
    title = "VibeXR \u00b7 Settings";
  } else {
    items = (app._worldItems || []).concat(inGallery ? [nav.settings] : [nav.home, nav.settings]);
    title = ((world && world.title) || "VibeXR");
  }
  const rows = Math.ceil(items.length / 2);
  const h = 0.028 + rows * 0.032 + (slider ? 0.048 : 0.016);
  const old = menu.panel;
  for (const i of menu.items) i.root.removeFromParent();       // keep the buttons, drop the panel
  menu.items = [];
  if (Math.abs(old.h - h) > 1e-4 || old._title !== title) {
    const np = new UIPanel(title, { w: 0.17, h });
    np._title = title;
    np.root.visible = old.root.visible;
    np.root.position.copy(old.root.position);
    np.root.quaternion.copy(old.root.quaternion);
    np.root.scale.copy(old.root.scale);
    old.root.parent?.add(np.root);
    old.root.removeFromParent();
    old.root.traverse((o) => { o.geometry?.dispose?.(); if (o.material) { o.material.map?.dispose?.(); o.material.dispose?.(); } });
    menu.panel = np; menu.root = np.root;
  }
  menu.setItems(items, slider);
  app._menuPage = page;
}

// ---------------------------------------------------------------------------
// Gallery: the lobby. Each work is a painted sphere on a plinth; tap to enter.
// ---------------------------------------------------------------------------
var Gallery = {
  id: "gallery",
  title: "Gallery",
  init(ctx) {
    const { root, THREE: T, app } = ctx;
    this.app = app;
    const top = calibratedTableTop(app);
    root.add(new T.HemisphereLight(0xcfe0ff, 0x202030, 1.4));
    this.balls = [];
    this.entering = null;
    this.time = 0;
    setImmersive(app, false);      // the hall is your room
    const n = ART.length, gap = 0.62;
    ART.forEach((a, i) => {
      const x = (i - (n - 1) / 2) * gap, z = -0.85;
      const tex = previewTexture(app, T, a);
      const mat = new T.MeshBasicMaterial({ map: tex, toneMapped: false });
      const ball = new T.Mesh(new T.SphereGeometry(0.12, 48, 32), mat);
      ball.position.set(x, top + 0.26, z); ball.name = `preview-${a.id}`;
      ball.userData.noHighlight = true;
      root.add(ball);
      // hover: a soft shell around the globe, additive and view-independent
      const halo = new T.Mesh(new T.SphereGeometry(0.128, 32, 20), new T.MeshBasicMaterial({
        color: 0xf6d76b, transparent: true, opacity: 0, blending: T.AdditiveBlending,
        side: T.BackSide, depthWrite: false, toneMapped: false
      }));
      halo.userData.noCollider = true; halo.userData.noHighlight = true;
      ball.add(halo);
      const title = ctx.label(a.title, { height: 0.03, color: "#f6d76b" });
      title.position.set(x, top + 0.45, z); root.add(title);
      const by = ctx.label(`${a.byline}  \u00b7  tap to enter`, { height: 0.016, color: "#cfe0ff" });
      by.position.set(x, top + 0.415, z); root.add(by);
      const it = ctx.add(ball, {});
      const st = { a, ball, mat, halo, it, hover: 0, hovering: false, base: ball.position.clone(), labels: [title, by], phase: i * 1.7 };
      it.on("hoverenter", () => { st.hovering = true; });
      it.on("hoverexit", () => { st.hovering = false; });
      it.on("tap", () => this.enterArt(st));
      this.balls.push(st);
    });
    const hint = ctx.label("Pinch, trigger or poke a sphere to step inside · palm up for the menu", { height: 0.014, color: "#8fa6c8" });
    hint.position.set(0, top + 0.03, -0.72); hint.rotation.x = -0.9; root.add(hint);
  },
  menuItems(ctx) { return []; },
  enterArt(st) {
    if (this.entering) return;
    this.entering = { st, t: 0 };
    this.app.log(`entering ${st.a.title}`);
  },
  update(dt, t, ctx) {
    const head = ctx.app.im.head;
    this.time += Math.min(dt, 0.05); t = this.time;
    for (const s of this.balls) {
      s.hover += ((s.hovering ? 1 : 0) - s.hover) * Math.min(1, dt * 10);
      s.halo.material.opacity = s.hover * 0.28;
      s.ball.rotation.y += dt * 0.12;
      if (!this.entering) {
        // breathing: a slow rise and fall with a small swell in the same rhythm
        const br = Math.sin(t * 0.9 + s.phase), br2 = Math.sin(t * 1.8 + s.phase * 1.3);
        s.ball.position.y = s.base.y + br * 0.022 + br2 * 0.004;
        s.ball.scale.setScalar((1 + br * 0.018) * (1 + 0.06 * s.hover));
      }
      for (const l of s.labels) if (head) l.lookAt(head.x, l.position.y, head.z);
    }
    const e = this.entering;
    if (e) {
      e.t += dt;
      const k = Math.min(1, e.t / 0.7), ease = k * k * (3 - 2 * k);
      e.st.ball.scale.setScalar(1 + ease * 0.7);          // grow in place: flying it into your face reads badly in stereo
      e.st.halo.material.opacity = 0.28 + ease * 0.5;
      if (k >= 1 && !e.done) { e.done = true; ctx.app.worlds.load(e.st.a.id); }
    }
  }
};

// ---------------------------------------------------------------------------
// Shared bits for a world you stand inside: the camera has to see past 100 m,
// and the framework's background opacity drives how much of the room is left.
// ---------------------------------------------------------------------------
function enterArtWorld(world, ctx) {
  const app = ctx.app;
  world.app = app;
  world.time = 0;
  world._opacity = app.sessionMode === "ar" && app.vst.supported ? app.vst.target : null;
  // no floating button inside an artwork: the hand menu carries "← Gallery"
}
function exitArtWorld(world, ctx) {
  const app = ctx.app;
  if (world._opacity !== null) app.setOpacity(world._opacity, false);
}
// where the head is, whichever part of the framework has it first
function headPos(app, out) {
  if (app.im && app.im.head) return out.copy(app.im.head);
  if (app.input && app.input.head) return out.copy(app.input.head);
  return app.camera.getWorldPosition(out);
}
// how opaque the artwork should be right now: fully in VR, the slider's value in passthrough
function artAlpha(app) { return app.sessionMode === "ar" ? app.vst.opacity : 1; }
// When the world paints its own sky, the framework's dark backdrop has nothing
// left to do — it would only sit behind the painting and dull it.
function ownSky(app, has) { if (has) app.backdrop.visible = false; }
// Anything that is not a world you stand inside belongs in your room: the
// gallery and every widget mode start with passthrough on, the immersive modes
// take the background opaque. (The Background slider still overrides by hand.)
function setImmersive(app, on) {
  if (app.sessionMode !== "ar" || !app.vst.supported) return;
  app.setOpacity(on ? 1 : 0, false);
}
// every source whose pinch / trigger isn't aimed at something interactive
function freeSelects(app, onDown, onHold, onEnd, held) {
  const live = new Set();
  for (const g of app.im.groups.values()) {
    const src = g.source; live.add(src);
    const cur = held.get(src);
    if (cur) {
      if (!src.select || !src.ray.valid) { onEnd(src, cur); held.delete(src); }
      else onHold(src, cur);
      continue;
    }
    if (!src.selectDown || !src.ray.valid) continue;
    if (src.kind === "hand" && src.palmFacingHead) continue;
    if (g.list.some((i) => i.hover || i.selecting)) continue;
    const made = onDown(src);
    if (made) held.set(src, made);
  }
  for (const [src, v] of held) if (!live.has(src)) { onEnd(src, v); held.delete(src); }
}

// ---------------------------------------------------------------------------
// The Starry Night. Pinch / trigger at the sky to stir a vortex; the hand menu
// carries the dome / sphere / cube modes, and in the volume modes you can pick
// the whole painting up and scale it with two hands.
// ---------------------------------------------------------------------------
var StarryNight = {
  id: "starry-night",
  title: "The Starry Night",
  init(ctx) {
    const { root, THREE: T, app } = ctx;
    enterArtWorld(this, ctx);
    this.sn = buildStarryNight(T, root);
    this.sn.dabUniforms.uSize.value = app.sessionMode ? 1.6 : 1.35;
    setImmersive(app, true);       // you stand under this sky
    this.held = new Map();
    this.sign = new Map();
    this.sq = new Map();
    // an invisible handle for the volume modes, so the framework's own grab works on it
    const proxy = new T.Mesh(new T.SphereGeometry(1, 20, 14), new T.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false }));
    proxy.name = "painting"; proxy.visible = false; proxy.userData.noHighlight = true;
    proxy.position.copy(this.sn.dabUniforms.uVolCenter.value);
    proxy.scale.setScalar(this.sn.dabUniforms.uVolR.value);
    root.add(proxy);
    this.proxyIt = ctx.add(proxy, { draggable: true, twoHand: true });
    this.proxy = proxy;
    ctx.log(`Starry Night: ${this.sn.N.toLocaleString()} particles`);
  },
  menuItems(ctx) {
    const sn = this.sn;
    const btns = ["Dome", "Sphere", "Cube"].map((label, i) => ctx.button(label, {
      w: 0.075, h: 0.026, fontSize: 24, toggle: true, value: i === sn.shape.target,
      onClick: () => { this.setShape(ctx, i); }
    }));
    this.shapeBtns = btns;
    return btns.concat([ctx.button("Calm the sky", { w: 0.075, h: 0.026, fontSize: 22, onClick: () => { for (const v of sn.userVortices) { v.held = false; v.strength = 0.01; } } })]);
  },
  setShape(ctx, i) {
    const sn = this.sn, app = ctx.app;
    setImmersive(app, i === 0);
    if (i > 0 && sn.shape.target === 0) {                  // bring the volume to arm's length
      const head = headPos(app, new ctx.THREE.Vector3()), dir = new ctx.THREE.Vector3();
      app.camera.getWorldDirection(dir); dir.y = 0; dir.normalize();
      sn.placeVolume(head.x + dir.x * 0.85, Math.max(0.8, head.y - 0.2), head.z + dir.z * 0.85, 0.45);
      this.proxy.position.copy(sn.dabUniforms.uVolCenter.value);
      this.proxy.scale.setScalar(0.45);
    }
    sn.setShape(i);
    if (this.shapeBtns) this.shapeBtns.forEach((b, k) => b.setValue(k === i));
  },
  update(dt, t, ctx) {
    const app = ctx.app, sn = this.sn;
    this.time += Math.min(dt, 0.05); t = this.time;
    sn.shared.uTime.value = t;
    // the volume modes: the painting sits on a handle you can carry and scale
    const vol = sn.shape.target > 0 || sn.shape.animating;
    this.proxy.visible = vol;
    if (vol) {
      const held = this.proxyIt.selections.length > 0;
      sn.shape.held = held;
      const r = Math.min(1.4, Math.max(0.16, this.proxy.scale.x));
      this.proxy.scale.setScalar(r);
      sn.dabUniforms.uVolR.value = r;
      sn.dabUniforms.uVolCenter.value.copy(this.proxy.position);
    } else sn.shape.held = false;
    sn.updateShape(dt);
    sn.updateFrames(t, artAlpha(app));
    ownSky(app, sn.shape.target === 0 && !sn.shape.animating);
    freeSelects(app, (src) => {
      if (src.kind === "controller") {
        const sq = src.squeeze > 0.5;
        if (sq && !this.sq.get(src)) this.sign.set(src, -(this.sign.get(src) || 1));
        this.sq.set(src, sq);
      }
      const sign = src.kind === "controller" ? (this.sign.get(src) || 1) : src.handedness === "left" ? -1 : 1;
      return sn.beginVortex(sn.aimAxis(src.ray.origin, src.ray.dir), sign);
    }, (src, v) => {
      v.dir.copy(sn.aimAxis(src.ray.origin, src.ray.dir));
      if (src.kind === "controller") {
        const sq = src.squeeze > 0.5;
        if (sq && !this.sq.get(src)) { const s = -(this.sign.get(src) || 1); this.sign.set(src, s); v.sign = s; }
        this.sq.set(src, sq);
      }
    }, (src, v) => { v.held = false; }, this.held);
    sn.updateVortices(dt, t);
  },
  exit(ctx) { exitArtWorld(this, ctx); this.held.clear(); this.shapeBtns = null; }
};

// ---------------------------------------------------------------------------
// Impression, Sunrise. Pinch / trigger at the water to pull a wake through it.
// ---------------------------------------------------------------------------
var MonetSunrise = {
  id: "impression-sunrise",
  title: "Impression, Sunrise",
  init(ctx) {
    const { root, THREE: T, app } = ctx;
    enterArtWorld(this, ctx);
    this.mn = buildMonet(T, root, app);
    this.mn.onMode(() => { this.syncButtons(); this.syncHandle(); });
    this.applyVST(ctx);
    // the handle: a tray just under the widget. Drag it to carry the painting,
    // two hands to scale and turn it — the same grab as anything else in the
    // framework. Pinching inside the glass stirs the paint instead.
    const handle = new T.Mesh(new T.TorusGeometry(1, 0.08, 10, 40).rotateX(Math.PI / 2), new T.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false }));
    handle.name = "painting"; handle.userData.noHighlight = true;
    root.add(handle);
    this.handleIt = ctx.add(handle, { draggable: true, twoHand: true });
    this.handle = handle;
    this.handleIt.on("hoverenter", () => { this.hot = true; });
    this.handleIt.on("hoverexit", () => { this.hot = false; });
    this._y = new T.Vector3(0, 1, 0);
    this._p = new T.Vector3();
    this.syncHandle();
    ctx.log(`Impression, Sunrise: ${this.mn.N.toLocaleString()} strokes`);
  },
  // Globe and Cube are widgets you hold in your room; Immersive puts you in the
  // painting, so it takes the background with it
  applyVST(ctx) { setImmersive(ctx.app, !this.mn.isWidget()); },
  menuItems(ctx) {
    const mn = this.mn;
    const b = (label, isActive, onClick) => ctx.button(label, { w: 0.075, h: 0.026, fontSize: 22, toggle: true, value: isActive(), onClick });
    this.btns = [
      b("Globe", () => mn.mode === "globe", () => { mn.setMode("globe"); this.applyVST(ctx); }),
      b("Cube", () => mn.mode === "cube", () => { mn.setMode("cube"); this.applyVST(ctx); }),
      b("Immersive", () => mn.mode === "immersive", () => { mn.setMode("immersive"); this.applyVST(ctx); }),
      b("Whirl", () => mn.FX.pinch === "whirl", () => mn.setPinch("whirl")),
      b("Gather", () => mn.FX.pinch === "gather", () => mn.setPinch("gather")),
      b("Scatter", () => mn.FX.pinch === "scatter", () => mn.setPinch("scatter")),
      b("Speed", () => mn.FX.accelerate, () => mn.toggleFX("accelerate")),
      b("Mist", () => mn.FX.mist, () => mn.toggleFX("mist")),
      b("Sun \u2191", () => mn.FX.sunUp, () => mn.toggleFX("sunUp"))
    ];
    this.btns.push(ctx.button("Recentre", { w: 0.075, h: 0.026, fontSize: 22, onClick: () => mn.recentreGlobe() }));
    this.states = [() => mn.mode === "globe", () => mn.mode === "cube", () => mn.mode === "immersive",
      () => mn.FX.pinch === "whirl", () => mn.FX.pinch === "gather", () => mn.FX.pinch === "scatter",
      () => mn.FX.accelerate, () => mn.FX.mist, () => mn.FX.sunUp];
    return this.btns;
  },
  syncButtons() {
    if (!this.btns || !this.states) return;
    this.states.forEach((f, i) => this.btns[i].setValue(f()));
  },
  // handle ← pose
  syncHandle() {
    const mn = this.mn, p = mn.globePose;
    if (!this.handle) return;
    this.handle.visible = mn.isWidget();
    const s = mn.R * mn.GLOBE_SCALE * p.scale * 1.12;
    this.handle.position.set(p.pos.x, p.pos.y - 0.035 * p.scale, p.pos.z);
    this.handle.scale.setScalar(s);
    this.handle.quaternion.setFromAxisAngle(this._y, p.yaw);
  },
  update(dt, t, ctx) {
    const mn = this.mn, app = ctx.app;
    this.time += Math.min(dt, 0.05);
    const held = this.handleIt.selections.length > 0;
    mn.setHandleHot(held || this.hot);
    if (mn.isWidget() && held) {                       // pose ← handle
      const sc = Math.min(3, Math.max(0.35, this.handle.scale.x / (mn.R * mn.GLOBE_SCALE * 1.12)));
      this._p.copy(this.handle.position); this._p.y += 0.035 * sc;
      const e = new ctx.THREE.Euler().setFromQuaternion(this.handle.quaternion, "YXZ");
      mn.setPose(this._p, sc, e.y);
    } else this.syncHandle();
    mn.update(Math.min(dt, 0.05), this.time);
    ownSky(app, mn.mode === "immersive");
  },
  exit(ctx) { exitArtWorld(this, ctx); this.btns = null; }
};

// ---------------------------------------------------------------------------
// A Thousand Li of Rivers and Mountains. Immersive puts you on the shore;
// Globe and Scroll are the painting held at arm's length, carried by the same
// handle as the others. Pinch to sweep the mist and ruffle the river.
// ---------------------------------------------------------------------------
var QianliJiangshan = {
  id: "qianli-jiangshan",
  title: "Rivers and Mountains",
  init(ctx) {
    const { root, THREE: T, app } = ctx;
    enterArtWorld(this, ctx);
    this.qj = buildQianli(T, root, app);
    this.qj.onMode(() => this.syncButtons());
    this.qj.recentre();
    setImmersive(app, !this.qj.isWidget());
    const handle = new T.Mesh(new T.TorusGeometry(1, 0.08, 10, 40).rotateX(Math.PI / 2), new T.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false }));
    handle.name = "scroll"; handle.userData.noHighlight = true;
    root.add(handle);
    this.handleIt = ctx.add(handle, { draggable: true, twoHand: true });
    this.handle = handle;
    this.handleIt.on("hoverenter", () => { this.hot = true; });
    this.handleIt.on("hoverexit", () => { this.hot = false; });
    this._y = new T.Vector3(0, 1, 0);
    this._p = new T.Vector3();
    this.syncHandle();
    ctx.log(`Rivers and Mountains: ${this.qj.N.toLocaleString()} strokes`);
  },
  menuItems(ctx) {
    const qj = this.qj;
    const b = (label, isActive, onClick) => ctx.button(label, { w: 0.075, h: 0.026, fontSize: 22, toggle: true, value: isActive(), onClick });
    const mode = (m, label) => b(label, () => qj.mode === m, () => {
      qj.setMode(m);
      if (qj.isWidget()) qj.recentre();
      setImmersive(ctx.app, !qj.isWidget());
