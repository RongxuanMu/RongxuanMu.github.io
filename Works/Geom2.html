<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometria AI - 语音数学可视化</title>
    <!-- 引入数学解析与3D渲染库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        :root {
            --bg: #05070a;
            --sidebar: rgba(10, 12, 18, 0.85);
            --card: rgba(20, 25, 35, 0.6);
            --text: #f1f5f9;
            --text-muted: #64748b;
            --primary: #6366f1;
            --primary-hover: #818cf8;
            --accent: #10b981;
            --border: rgba(255, 255, 255, 0.08);
        }

        [data-theme='light'] {
            --bg: #f8fafc;
            --sidebar: rgba(255, 255, 255, 0.9);
            --card: rgba(241, 245, 249, 0.8);
            --text: #0f172a;
            --text-muted: #64748b;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --accent: #059669;
            --border: rgba(0, 0, 0, 0.08);
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            background-color: var(--bg);
            color: var(--text);
            overflow: hidden;
            transition: background-color 0.5s ease;
        }

        #app { display: flex; height: 100vh; width: 100vw; }

        /* 侧边栏 */
        #sidebar {
            width: 320px;
            min-width: 320px;
            background: var(--sidebar);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 32px;
            z-index: 100;
            overflow-y: auto;
            box-sizing: border-box;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.04em;
        }

        .header-controls {
            display: flex;
            gap: 8px;
        }

        .theme-toggle {
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text);
            width: 34px;
            height: 34px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        .theme-toggle:hover { background: var(--primary); color: white; }

        .equation-card {
            background: var(--card);
            padding: 20px;
            border-radius: 18px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            font-family: "Cambria Math", serif;
            color: var(--accent);
            text-align: center;
            word-break: break-all;
            line-height: 1.4;
        }

        .input-group {
            position: relative;
            margin-bottom: 16px;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 44px 14px 16px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            box-sizing: border-box;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus { border-color: var(--primary); }

        .mic-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
        }
        .mic-btn.active { color: #ef4444; animation: pulse 1.5s infinite; }

        @keyframes pulse {
            0% { transform: translateY(-50%) scale(1); }
            50% { transform: translateY(-50%) scale(1.2); }
            100% { transform: translateY(-50%) scale(1); }
        }

        .main-btn {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 24px;
            transition: 0.3s;
        }
        .main-btn:hover { background: var(--primary-hover); transform: translateY(-1px); }

        .quick-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 24px;
        }

        .quick-btn {
            padding: 10px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 0.7rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .quick-btn:hover { background: var(--primary); color: white; }

        .params-section h3 {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-bottom: 12px;
            font-weight: 700;
        }

        .slider-item {
            margin-bottom: 12px;
            background: var(--card);
            padding: 12px;
            border-radius: 10px;
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            margin-bottom: 6px;
            color: var(--text-muted);
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--primary);
            cursor: pointer;
            height: 4px;
        }

        #render-container {
            flex: 1;
            position: relative;
            background: var(--bg);
        }

        .toast {
            position: absolute;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: #ef4444;
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 0.85rem;
            display: none;
            z-index: 1000;
        }
    </style>
</head>
<body>

<div id="app">
    <aside id="sidebar">
        <div class="header">
            <div class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path></svg>
                Geometria AI
            </div>
            <div class="header-controls">
                <button class="theme-toggle" id="fullscreen-btn" title="全屏模式">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>
                </button>
                <button class="theme-toggle" id="theme-toggle" title="切换模式">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                </button>
            </div>
        </div>

        <div class="equation-card" id="equation-view">z = a·x² - b·y²</div>

        <div class="input-group">
            <input type="text" id="func-input" placeholder="输入公式、术语或语音描述">
            <button class="mic-btn" id="mic-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path></svg>
            </button>
        </div>

        <button class="main-btn" id="render-btn">开始渲染</button>

        <div class="quick-grid">
            <button class="quick-btn" onclick="applyPreset('y = k*x + b')">一次函数</button>
            <button class="quick-btn" onclick="applyPreset('y = a*x^2 + b*x')">二次曲线</button>
            <button class="quick-btn" onclick="applyPreset('y = a*sin(k*x)')">三角函数</button>
            <button class="quick-btn" onclick="applyPreset('y = a/x')">反比例函数</button>
            <button class="quick-btn" onclick="applyPreset('z = a*x^2 - b*y^2')">双曲马鞍面</button>
            <button class="quick-btn" onclick="applyPreset('z = a*cos(k*sqrt(x^2+y^2))')">波纹曲面</button>
        </div>

        <div class="params-section">
            <h3>参数微调</h3>
            <div id="sliders-container"></div>
        </div>
    </aside>

    <main id="render-container">
        <div id="toast" class="toast">公式解析异常</div>
    </main>
</div>

<script>
    // --- 核心状态与资源 ---
    let scene, camera, renderer, controls, currentObject;
    let theme = 'dark';
    let paramsValues = { a: 0.1, b: 0.1, k: 0.5, r: 8, k: 1, b: 0, c: 0 };
    let lastRawInput = "z = a*x^2 - b*y^2";
    let squareFadeMap = null;
    
    // 物理裁切范围
    const clipLimit = 10;
    const clipPlanes = [
        new THREE.Plane(new THREE.Vector3(1, 0, 0), clipLimit),
        new THREE.Plane(new THREE.Vector3(-1, 0, 0), clipLimit),
        new THREE.Plane(new THREE.Vector3(0, 1, 0), clipLimit),
        new THREE.Plane(new THREE.Vector3(0, -1, 0), clipLimit),
        new THREE.Plane(new THREE.Vector3(0, 0, 1), clipLimit),
        new THREE.Plane(new THREE.Vector3(0, 0, -1), clipLimit)
    ];

    function generateSquareFade() {
        const canvas = document.createElement('canvas');
        canvas.width = 512; canvas.height = 512;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = 'black'; ctx.fillRect(0, 0, 512, 512);
        const margin = 100;
        for (let i = 0; i < margin; i++) {
            const opacity = i / margin;
            ctx.fillStyle = `rgba(255, 255, 255, ${opacity})`;
            const offset = margin - i;
            ctx.fillRect(offset, offset, 512 - offset * 2, 512 - offset * 2);
        }
        ctx.fillStyle = 'white'; ctx.fillRect(margin, margin, 512 - margin * 2, 512 - margin * 2);
        return new THREE.CanvasTexture(canvas);
    }

    // --- 初始化 3D 渲染器 ---
    function initViewport() {
        const container = document.getElementById('render-container');
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x05070a);
        squareFadeMap = generateSquareFade();

        camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(25, 20, 25);

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.localClippingEnabled = true;
        container.appendChild(renderer.domElement);

        const checkControls = setInterval(() => {
            const Orbit = THREE.OrbitControls || window.OrbitControls;
            if (Orbit) {
                controls = new Orbit(camera, renderer.domElement);
                controls.enableDamping = true;
                controls.dampingFactor = 0.08;
                clearInterval(checkControls);
            }
        }, 100);

        // --- 坐标系参考 ---
        const gridXZ = new THREE.GridHelper(20, 20, 0x2d3748, 0x1a202c);
        scene.add(gridXZ);
        const gridXY = new THREE.GridHelper(20, 20, 0x2d3748, 0x1a202c);
        gridXY.rotation.x = Math.PI / 2;
        gridXY.material.opacity = 0.05; gridXY.material.transparent = true;
        scene.add(gridXY);

        scene.add(new THREE.AxesHelper(5));
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        const pointLight = new THREE.PointLight(0xffffff, 0.8);
        pointLight.position.set(20, 40, 20);
        scene.add(pointLight);

        document.getElementById('theme-toggle').onclick = () => {
            theme = theme === 'dark' ? 'light' : 'dark';
            document.body.setAttribute('data-theme', theme);
            scene.background.setHex(theme === 'dark' ? 0x05070a : 0xf8fafc);
            gridXZ.material.color.setHex(theme === 'dark' ? 0x2d3748 : 0xd1d5db);
            document.getElementById('theme-toggle').innerHTML = theme === 'dark' ? 
                '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>' : 
                '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line></svg>';
        };

        // 全屏功能
        document.getElementById('fullscreen-btn').onclick = () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        };

        // 监听全屏状态变化，更新按钮图标
        document.addEventListener('fullscreenchange', () => {
            const fullscreenBtn = document.getElementById('fullscreen-btn');
            if (document.fullscreenElement) {
                fullscreenBtn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"></path></svg>';
                fullscreenBtn.title = '退出全屏';
            } else {
                fullscreenBtn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>';
                fullscreenBtn.title = '全屏模式';
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        animate();
    }

    function animate() {
        requestAnimationFrame(animate);
        if (controls) controls.update();
        renderer.render(scene, camera);
    }

    // --- 居中对焦逻辑 ---
    function focusOnObject() {
        if (!currentObject || !controls) return;
        const box = new THREE.Box3().setFromObject(currentObject);
        const center = new THREE.Vector3();
        box.getCenter(center);
        controls.target.copy(center);
    }

    function updateVisualization() {
        let input = document.getElementById('func-input').value || lastRawInput;
        const toast = document.getElementById('toast');
        toast.style.display = 'none';

        try {
            const cleanExpr = input.replace(/[\u4e00-\u9fa5]/g, '').trim();
            if (!cleanExpr) return;
            lastRawInput = cleanExpr;

            const parts = cleanExpr.split('=');
            let targetVar = parts.length === 2 ? parts[0].trim().toLowerCase() : 'z';
            let expr = parts.length === 2 ? parts[1].trim() : cleanExpr;
            const is3D = targetVar === 'z' || expr.includes('y');

            const node = math.parse(expr);
            const symbols = [];
            node.traverse((n) => {
                if (n.isSymbolNode && !['x', 'y', 'z', 'sin', 'cos', 'tan', 'asin', 'acos', 'atan', 'sqrt', 'exp', 'abs', 'log', 'pi', 'e', 'pow'].includes(n.name)) {
                    symbols.push(n.name);
                }
            });
            refreshSliders([...new Set(symbols)]);

            if (currentObject) {
                scene.remove(currentObject);
                currentObject.traverse(c => { if(c.geometry) c.geometry.dispose(); if(c.material) c.material.dispose(); });
            }

            const compiled = node.compile();
            if (is3D) renderSurface(compiled);
            else renderLine(compiled);

            focusOnObject();
            updateEquationDisplay();
        } catch (e) {
            toast.style.display = 'block';
        }
    }

    // 渲染线状图像 (2D 曲线)
    function renderLine(compiled) {
        const points = [];
        const segments = []; // 存储不连续的线段
        let currentSegment = [];

        for (let x = -15; x <= 15; x += 0.05) {
            const scope = { x, ...paramsValues };
            try {
                const y = compiled.evaluate(scope);
                // 处理无效数值和无穷大（如反比例函数在0处）
                if (typeof y === 'number' && isFinite(y) && Math.abs(y) < 50) {
                    currentSegment.push(new THREE.Vector3(x, y, 0));
                } else {
                    if (currentSegment.length > 0) segments.push(currentSegment);
                    currentSegment = [];
                }
            } catch(e){
                if (currentSegment.length > 0) segments.push(currentSegment);
                currentSegment = [];
            }
        }
        if (currentSegment.length > 0) segments.push(currentSegment);

        const group = new THREE.Group();
        const mat = new THREE.LineBasicMaterial({ 
            color: theme === 'dark' ? 0x6366f1 : 0x4f46e5, 
            linewidth: 4, 
            clippingPlanes: clipPlanes 
        });

        segments.forEach(seg => {
            const geo = new THREE.BufferGeometry().setFromPoints(seg);
            group.add(new THREE.Line(geo, mat));
        });

        currentObject = group;
        scene.add(currentObject);
    }

    function renderSurface(compiled) {
        const size = 22; 
        const res = 120;
        const geo = new THREE.PlaneGeometry(size, size, res, res);
        const pos = geo.attributes.position;
        for (let i = 0; i < pos.count; i++) {
            const x = pos.getX(i); const y = pos.getY(i);
            const scope = { x, y, ...paramsValues };
            try {
                let z = compiled.evaluate(scope);
                pos.setZ(i, isFinite(z) ? z : 0);
            } catch(e){ pos.setZ(i, 0); }
        }
        geo.computeVertexNormals();
        const mat = new THREE.MeshPhongMaterial({
            color: theme === 'dark' ? 0x6366f1 : 0x4f46e5,
            side: THREE.DoubleSide, transparent: true, opacity: 0.9,
            alphaMap: squareFadeMap, shininess: 100, specular: 0x444444,
            clippingPlanes: clipPlanes 
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.rotation.x = -Math.PI / 2;
        currentObject = mesh;
        scene.add(currentObject);
    }

    function refreshSliders(symbols) {
        const container = document.getElementById('sliders-container');
        const currentParams = Array.from(container.querySelectorAll('.slider-item')).map(el => el.dataset.p);
        if (JSON.stringify(currentParams) === JSON.stringify(symbols)) return;
        container.innerHTML = '';
        if (symbols.length === 0) {
            container.innerHTML = '<div style="color:var(--text-muted); font-size:0.7rem; text-align:center; padding:12px; border:1px dashed var(--border); border-radius:10px;">输入术语如“反比例函数”</div>';
            return;
        }
        symbols.forEach(s => {
            if (paramsValues[s] === undefined) paramsValues[s] = 1;
            const item = document.createElement('div');
            item.className = 'slider-item'; item.dataset.p = s;
            item.innerHTML = `
                <div class="slider-header"><span>参数 <b>${s.toUpperCase()}</b></span><span id="v-${s}">${paramsValues[s]}</span></div>
                <input type="range" min="-5" max="5" step="0.01" value="${paramsValues[s]}" oninput="updateP('${s}', this.value)">
            `;
            container.appendChild(item);
        });
    }

    function updateP(s, v) {
        paramsValues[s] = parseFloat(v);
        document.getElementById(`v-${s}`).innerText = v;
        updateVisualization();
    }

    function updateEquationDisplay() {
        let display = lastRawInput;
        Object.keys(paramsValues).forEach(key => {
            const regex = new RegExp(`\\b${key}\\b`, 'g');
            display = display.replace(regex, paramsValues[key]);
        });
        let pretty = display.replace(/\*/g, '·').replace(/\^2/g, '²').replace(/\^3/g, '³').replace(/sqrt/g, '√').replace(/\s+/g, ' ');
        document.getElementById('equation-view').innerText = pretty;
    }

    function applyPreset(f) {
        document.getElementById('func-input').value = f;
        updateVisualization();
    }

    // --- 强化版语音识别 ---
    function initSpeech() {
        const btn = document.getElementById('mic-btn');
        const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!Speech) return btn.style.display = 'none';
        const rec = new Speech(); rec.lang = 'zh-CN'; let listening = false;
        btn.onclick = () => listening ? rec.stop() : rec.start();
        rec.onstart = () => { listening = true; btn.classList.add('active'); };
        rec.onend = () => { listening = false; btn.classList.remove('active'); };
        rec.onresult = (e) => {
            let res = e.results[0][0].transcript;
            
            // 模型与函数术语语义映射
            const models = { 
                '马鞍面': 'z = a*x^2 - b*y^2', 
                '钟形': 'z = a/(x^2+y^2+1)', 
                '球面': 'z = sqrt(r^2-x^2-y^2)', 
                '波纹': 'z = a*cos(k*sqrt(x^2+y^2))', 
                '山丘': 'z = sin(k*x)*cos(k*y)',
                '一次函数': 'y = k*x + b',
                '线性': 'y = k*x + b',
                '二次函数': 'y = a*x^2 + b*x + c',
                '抛物线': 'y = a*x^2 + b*x + c',
                '三次函数': 'y = a*x^3 + b*x^2 + c',
                '反比例': 'y = k/x',
                '正弦': 'y = a*sin(k*x + b)',
                '余弦': 'y = a*cos(k*x + b)',
                '正切': 'y = a*tan(k*x)',
                '圆锥': 'z = sqrt(x^2 + y^2)'
            };
            for (let n in models) if (res.includes(n)) { applyPreset(models[n]); return; }

            const dict = { '等于': '=', '加': '+', '减': '-', '乘': '*', '除以': '/', '正弦': 'sin', '余弦': 'cos', '正切': 'tan', '根号': 'sqrt' };
            for (let k in dict) res = res.split(k).join(dict[k]);
            res = res.replace(/(\w+)分之(\w+)/g, '$2/$1').replace(/的(\d+)次方/g, '^$1').replace(/[\u4e00-\u9fa5]/g, '').trim();
            if (res) { document.getElementById('func-input').value = res; updateVisualization(); }
        };
    }

    window.onload = () => {
        setTimeout(() => {
            initViewport(); initSpeech();
