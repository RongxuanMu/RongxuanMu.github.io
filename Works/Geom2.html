<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 语音数学可视化系统</title>
    <!-- 引入数学解析与3D渲染库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
    <!-- 使用 jsDelivr 提供的稳定轨道控制脚本 -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #0f172a;
            --panel-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #10b981;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            overflow: hidden;
        }

        #app {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* 左侧控制面板 */
        #sidebar {
            width: 320px;
            min-width: 320px;
            background: var(--panel-bg);
            border-right: 1px solid #334155;
            display: flex;
            flex-direction: column;
            padding: 24px;
            z-index: 100;
            box-shadow: 10px 0 15px -3px rgba(0, 0, 0, 0.2);
            overflow-y: auto;
            box-sizing: border-box;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 24px;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* 方程展示 */
        .equation-card {
            background: rgba(15, 23, 42, 0.8);
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 24px;
            border: 1px solid rgba(99, 102, 241, 0.3);
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            font-family: "Cambria Math", "Times New Roman", serif;
            color: var(--accent);
            word-break: break-all;
            text-align: center;
        }

        /* 输入组 */
        .input-group {
            position: relative;
            margin-bottom: 12px;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 45px 14px 14px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            color: white;
            box-sizing: border-box;
            transition: all 0.2s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .mic-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }

        .mic-btn.active {
            color: #ef4444;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: translateY(-50%) scale(1); opacity: 1; }
            50% { transform: translateY(-50%) scale(1.2); opacity: 0.7; }
            100% { transform: translateY(-50%) scale(1); opacity: 1; }
        }

        .main-btn {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 24px;
            transition: all 0.2s;
        }

        .main-btn:hover { background: var(--primary-hover); transform: translateY(-1px); }

        /* 快捷按钮 */
        .quick-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 24px;
        }

        .quick-btn {
            padding: 10px;
            background: #334155;
            border: none;
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.8rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .quick-btn:hover { background: #475569; }

        /* 参数调节 */
        .params-section h3 {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 16px;
        }

        .slider-item {
            margin-bottom: 16px;
            background: rgba(15, 23, 42, 0.4);
            padding: 12px;
            border-radius: 10px;
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 8px;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--primary);
            cursor: pointer;
        }

        /* 渲染区 */
        #render-container {
            flex: 1;
            position: relative;
            background: #000;
        }

        .toast {
            position: absolute;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: #ef4444;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.9rem;
            display: none;
            z-index: 1000;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
        }

        .view-controls {
            position: absolute;
            bottom: 24px;
            right: 24px;
            display: flex;
            gap: 12px;
        }

        .control-bubble {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            padding: 10px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            transition: all 0.2s;
        }

        .control-bubble:hover { background: rgba(71, 85, 105, 0.9); transform: scale(1.1); }

        .color-picker {
            position: absolute;
            top: 24px;
            right: 24px;
            display: flex;
            gap: 10px;
            background: rgba(30, 41, 59, 0.5);
            padding: 8px;
            border-radius: 20px;
            backdrop-filter: blur(8px);
        }

        .dot {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.2s;
        }

        .dot:hover { transform: scale(1.2); }
        .dot.active { border-color: white; }
    </style>
</head>
<body>

<div id="app">
    <aside id="sidebar">
        <div class="logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
            MathVisual AI
        </div>

        <div class="equation-card" id="equation-view">z = x² + y²</div>

        <div class="input-group">
            <input type="text" id="func-input" placeholder="输入公式或说出模型名称">
            <button class="mic-btn" id="mic-btn" title="语音输入">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
            </button>
        </div>

        <button class="main-btn" id="render-btn">立即生成图像</button>

        <div class="quick-grid">
            <button class="quick-btn" onclick="applyPreset('y = k*x + b')">一次函数</button>
            <button class="quick-btn" onclick="applyPreset('y = a/x')">反比例函数</button>
            <button class="quick-btn" onclick="applyPreset('y = a*sin(x)')">三角函数</button>
            <button class="quick-btn" onclick="applyPreset('z = x^2 - y^2')">马鞍面</button>
            <button class="quick-btn" onclick="applyPreset('z = a*cos(x^2+y^2)')">涟漪面</button>
            <button class="quick-btn" onclick="applyPreset('z = sqrt(r^2 - x^2 - y^2)')">球面</button>
        </div>

        <div class="params-section">
            <h3>实时参数调节</h3>
            <div id="sliders-container">
                <!-- 动态参数滑动条在此生成 -->
            </div>
        </div>
    </aside>

    <main id="render-container">
        <div id="toast" class="toast">格式错误，请输入正确的数学表达式</div>
        
        <div class="color-picker">
            <div class="dot active" style="background: #6366f1;" onclick="setTheme(0x6366f1, this)"></div>
            <div class="dot" style="background: #10b981;" onclick="setTheme(0x10b981, this)"></div>
            <div class="dot" style="background: #f59e0b;" onclick="setTheme(0xf59e0b, this)"></div>
            <div class="dot" style="background: #ec4899;" onclick="setTheme(0xec4899, this)"></div>
        </div>

        <div class="view-controls">
            <div class="control-bubble" title="重置视角" id="reset-view">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><polyline points="3 3 3 8 8 8"></polyline></svg>
            </div>
        </div>
    </main>
</div>

<script>
    // --- 核心状态 ---
    let scene, camera, renderer, controls, currentObject;
    let currentThemeColor = 0x6366f1;
    let paramsValues = { k: 1, b: 0, a: 1, r: 5 };

    // --- 初始化渲染引擎 ---
    function initViewport() {
        const container = document.getElementById('render-container');
        if (!container) return;

        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0f1e);

        const width = container.clientWidth || window.innerWidth - 320;
        const height = container.clientHeight || window.innerHeight;

        camera = new THREE.PerspectiveCamera(70, width / height, 0.1, 1000);
        camera.position.set(15, 15, 15);

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // 强健的 OrbitControls 初始化逻辑
        function setupControls() {
            const OrbitControlsConstructor = 
                THREE.OrbitControls || 
                (window.THREE && window.THREE.OrbitControls) || 
                window.OrbitControls;

            if (OrbitControlsConstructor) {
                controls = new OrbitControlsConstructor(camera, renderer.domElement);
                controls.enableDamping = true;
                controls.dampingFactor = 0.05;
                return true;
            }
            return false;
        }

        if (!setupControls()) {
            console.warn("OrbitControls 尚未就绪，尝试轮询加载...");
            let retryCount = 0;
            const interval = setInterval(() => {
                if (setupControls() || retryCount > 10) {
                    clearInterval(interval);
                }
                retryCount++;
            }, 200);
        }

        // --- 坐标系统网格 (XY, XZ, YZ) ---
        // 1. 水平地面网格 (XZ 平面)
        const gridXZ = new THREE.GridHelper(30, 30, 0x4f46e5, 0x1e293b);
        scene.add(gridXZ);

        // 2. 正面垂直网格 (XY 平面)
        const gridXY = new THREE.GridHelper(30, 30, 0x334155, 0x1e293b);
        gridXY.rotation.x = Math.PI / 2;
        gridXY.material.opacity = 0.2;
        gridXY.material.transparent = true;
        scene.add(gridXY);

        // 3. 侧面垂直网格 (YZ 平面)
        const gridYZ = new THREE.GridHelper(30, 30, 0x334155, 0x1e293b);
        gridYZ.rotation.z = Math.PI / 2;
        gridYZ.material.opacity = 0.2;
        gridYZ.material.transparent = true;
        scene.add(gridYZ);

        // 基础坐标轴
        const axesHelper = new THREE.AxesHelper(15);
        scene.add(axesHelper);

        // 灯光配置
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(10, 20, 10);
        scene.add(directionalLight);

        window.addEventListener('resize', onWindowResize);
        document.getElementById('reset-view').addEventListener('click', () => {
            if (controls) controls.reset();
            camera.position.set(15, 15, 15);
        });

        animate();
    }

    function onWindowResize() {
        const container = document.getElementById('render-container');
        if (!container) return;
        const width = container.clientWidth;
        const height = container.clientHeight;
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
        renderer.setSize(width, height);
    }

    function animate() {
        requestAnimationFrame(animate);
        if (controls) controls.update();
        if (renderer && scene && camera) renderer.render(scene, camera);
    }

    // --- 数学计算与可视化渲染 ---
    function updateVisualization() {
        let rawInput = document.getElementById('func-input').value || "z = x^2 + y^2";
        const toast = document.getElementById('toast');
        toast.style.display = 'none';

        try {
            const cleanInput = rawInput.replace(/[\u4e00-\u9fa5]/g, '').trim();
            if (!cleanInput) return;

            const parts = cleanInput.split('=');
            let targetVar = 'z';
            let expression = cleanInput;

            if (parts.length === 2) {
                targetVar = parts[0].trim().toLowerCase();
                expression = parts[1].trim();
            } else {
                targetVar = 'z';
                expression = cleanInput;
            }

            const is3D = targetVar === 'z' || expression.includes('y');
            
            const node = math.parse(expression);
            const symbols = [];
            node.traverse((n) => {
                if (n.isSymbolNode && !['x', 'y', 'z', 'sin', 'cos', 'tan', 'asin', 'acos', 'atan', 'sqrt', 'exp', 'abs', 'log', 'pi', 'e', 'pow'].includes(n.name)) {
                    symbols.push(n.name);
                }
            });
            const uniqueSymbols = [...new Set(symbols)];
            updateSliders(uniqueSymbols);

            if (currentObject) {
                scene.remove(currentObject);
                currentObject.traverse(child => {
                    if (child.geometry) child.geometry.dispose();
                    if (child.material) child.material.dispose();
                });
            }

            const compiled = node.compile();

            if (is3D) {
                render3D(compiled);
            } else {
                render2D(compiled);
            }

            updateEquationDisplay(cleanInput);
        } catch (err) {
            console.warn("解析跳过:", err.message);
            if (rawInput.length > 0 && (rawInput.includes('z') || rawInput.includes('y') || rawInput.includes('x'))) {
                toast.style.display = 'block';
            }
        }
    }

    function render2D(compiled) {
        const points = [];
        for (let x = -15; x <= 15; x += 0.1) {
            const scope = { x, ...paramsValues };
            try {
                const y = compiled.evaluate(scope);
                if (typeof y === 'number' && isFinite(y)) {
                    points.push(new THREE.Vector3(x, y, 0));
                }
            } catch (e) {}
        }
        const geometry = new THREE.BufferGeometry().setFromPoints(points);
        const material = new THREE.LineBasicMaterial({ color: currentThemeColor, linewidth: 4 });
        currentObject = new THREE.Line(geometry, material);
        scene.add(currentObject);
    }

    function render3D(compiled) {
        const size = 20;
        const segments = 100; // 提高细分数使表面更平滑
        const geometry = new THREE.PlaneGeometry(size, size, segments, segments);
        const pos = geometry.attributes.position;

        for (let i = 0; i < pos.count; i++) {
            const x = pos.getX(i);
            const y = pos.getY(i);
            const scope = { x, y, ...paramsValues };
            try {
                let z = compiled.evaluate(scope);
                if (typeof z !== 'number' || !isFinite(z)) z = 0;
                z = Math.max(-15, Math.min(15, z));
                pos.setZ(i, z);
            } catch (e) {
                pos.setZ(i, 0);
            }
        }

        pos.needsUpdate = true;
        geometry.computeVertexNormals();

        // 仅渲染平滑材质的实体曲面，不再添加 wireframe 网格
        const surfaceMat = new THREE.MeshPhongMaterial({
            color: currentThemeColor,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.85,
            shininess: 90,
            specular: 0x444444
        });
        
        const surfaceMesh = new THREE.Mesh(geometry, surfaceMat);
        surfaceMesh.rotation.x = -Math.PI / 2;
        
        currentObject = surfaceMesh;
        scene.add(currentObject);
    }

    function updateSliders(symbols) {
        const container = document.getElementById('sliders-container');
        const existingSliders = Array.from(container.querySelectorAll('.slider-item')).map(el => el.dataset.param);
        
        if (JSON.stringify(existingSliders) === JSON.stringify(symbols)) return;

        container.innerHTML = '';
        if (symbols.length === 0) {
            container.innerHTML = '<div style="color:var(--text-muted); font-size:0.8rem; padding: 10px; border: 1px dashed #334155; border-radius: 8px;">说出“双曲面”试试？</div>';
            return;
        }

        symbols.forEach(s => {
            if (paramsValues[s] === undefined) paramsValues[s] = 1;
            
            const item = document.createElement('div');
            item.className = 'slider-item';
            item.dataset.param = s;
            item.innerHTML = `
                <div class="slider-header">
                    <span>参数 <b>${s}</b></span>
                    <span id="val-${s}">${paramsValues[s]}</span>
                </div>
                <input type="range" min="-10" max="10" step="0.1" value="${paramsValues[s]}" 
                    oninput="onSliderChange('${s}', this.value)">
            `;
            container.appendChild(item);
        });
    }

    function onSliderChange(s, val) {
        paramsValues[s] = parseFloat(val);
        const valLabel = document.getElementById(`val-${s}`);
        if (valLabel) valLabel.innerText = val;
        updateVisualization();
    }

    function updateEquationDisplay(text) {
        const view = document.getElementById('equation-view');
        let pretty = text.replace(/\^2/g, '²').replace(/\^3/g, '³').replace(/sqrt/g, '√').replace(/\*/g, '·');
        view.innerText = pretty;
    }

    function applyPreset(func) {
        document.getElementById('func-input').value = func;
        updateVisualization();
    }

    function setTheme(color, el) {
        currentThemeColor = color;
        document.querySelectorAll('.dot').forEach(d => d.classList.remove('active'));
        el.classList.add('active');
        updateVisualization();
    }

    function initSpeech() {
        const btn = document.getElementById('mic-btn');
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
            btn.style.display = 'none';
            return;
        }

        const recognition = new SpeechRecognition();
        recognition.lang = 'zh-CN';
        let isListening = false;
        
        btn.onclick = () => {
            if (isListening) recognition.stop();
            else {
                try { recognition.start(); } catch (e) { console.error(e); }
            }
        };

        recognition.onstart = () => { isListening = true; btn.classList.add('active'); };
        recognition.onend = () => { isListening = false; btn.classList.remove('active'); };

        recognition.onresult = (event) => {
            let result = event.results[0][0].transcript;
            
            const models = {
                '马鞍面': 'z = x^2 - y^2', '双曲面': 'z = x^2 + y^2 - 5', 
                '抛物面': 'z = x^2 + y^2', '球面': 'z = sqrt(r^2 - x^2 - y^2)', 
                '圆锥面': 'z = sqrt(x^2 + y^2)', '涟漪': 'z = sin(sqrt(x^2 + y^2))', 
                '波浪': 'z = sin(x) + cos(y)'
            };

            for (let name in models) {
                if (result.includes(name)) {
                    document.getElementById('func-input').value = models[name];
                    updateVisualization();
                    return;
                }
            }
            
            const dict = {
                '等于': '=', '加': '+', '减': '-', '乘': '*', '除以': '/', 
                '的平方': '^2', '的立方': '^3', '平方': '^2', '立方': '^3',
                '正弦': 'sin', '余弦': 'cos', '正切': 'tan', '根号': 'sqrt'
            };
            for (let k in dict) { result = result.split(k).join(dict[k]); }

            result = result.replace(/(\w+)分之(\w+)/g, '$2/$1');
            result = result.replace(/的(\d+)次方/g, '^$1');
            result = result.replace(/根号下(\w+)/g, 'sqrt($1)');
            result = result.replace(/(\d+)([a-z])/gi, '$1*$2');
            
            const noise = ['请', '帮我', '画一个', '绘制', '显示', '一下', '图形', '图像', '函数', '生成', '看看'];
            noise.forEach(word => { result = result.split(word).join(''); });

            result = result.replace(/[\u4e00-\u9fa5]/g, '').trim();
            
            if (result.length > 0) {
                document.getElementById('func-input').value = result;
                updateVisualization();
            }
        };

        recognition.onerror = () => { isListening = false; btn.classList.remove('active'); };
    }

    window.onload = () => {
        setTimeout(() => {
            initViewport();
            initSpeech();
            document.getElementById('render-btn').onclick = updateVisualization;
            updateVisualization();
        }, 100);
    };
</script>

</body>
</html>
