<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Impression, Sunrise — WebXR</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #7d90b3; overflow: hidden; font-family: 'Georgia', serif; }

#panel {
  position: fixed; top: 16px; left: 16px; z-index: 20; width: 250px;
  padding: 14px 14px 12px; border-radius: 16px;
  background: rgba(15,22,38,0.72); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border: 1px solid rgba(255,241,222,0.14); color: #fff3e2;
  box-shadow: 0 8px 40px rgba(0,0,0,0.35);
}
#panel h1 { font-size: 1.05rem; font-weight: 300; letter-spacing: 4px; margin: 0 0 2px; }
#panel .sub { font-size: 0.6rem; letter-spacing: 3px; color: rgba(255,245,230,0.55); text-transform: uppercase; margin-bottom: 12px; }
#panel .grp { margin-bottom: 10px; }
#panel .lbl { font-size: 0.58rem; letter-spacing: 2.5px; color: rgba(255,245,230,0.5); text-transform: uppercase; margin-bottom: 5px; }
#panel .row { display: flex; gap: 5px; flex-wrap: wrap; }
.pb {
  flex: 1 1 0; min-width: 0; padding: 7px 6px; border-radius: 9px; cursor: pointer;
  font-family: 'Georgia', serif; font-size: 0.72rem; letter-spacing: 1px; white-space: nowrap;
  color: rgba(255,245,230,0.85); background: rgba(27,36,54,0.8); border: 1px solid rgba(255,241,222,0.28);
  transition: all .18s;
}
.pb:hover { background: rgba(255,241,222,0.16); }
.pb.on { background: rgba(255,77,28,0.9); border-color: rgba(255,220,190,0.9); color: #fff5e6; }
.pb.wide { flex: 1 1 100%; padding: 10px; font-size: 0.8rem; letter-spacing: 2.5px; }
.pb.xr { background: rgba(230,90,45,0.35); border-color: rgba(255,240,220,0.6); }
.pb.xr:hover:not(:disabled) { background: rgba(230,90,45,0.65); }
.pb:disabled { opacity: 0.4; cursor: not-allowed; }
#panel .hint { font-size: 0.6rem; letter-spacing: 1px; color: rgba(255,245,230,0.45); line-height: 1.6; margin-top: 8px; }
#panelToggle { position: fixed; top: 16px; left: 16px; z-index: 21; display: none; padding: 8px 12px; border-radius: 10px; cursor: pointer; font-family: 'Georgia', serif; font-size: 0.7rem; letter-spacing: 2px; color: #fff3e2; background: rgba(15,22,38,0.72); border: 1px solid rgba(255,241,222,0.2); }
#panel .close { position: absolute; top: 10px; right: 12px; background: none; border: none; color: rgba(255,245,230,0.5); cursor: pointer; font-size: 0.9rem; }
@media (max-width: 520px) { #panel { width: calc(100vw - 32px); } }

#hud {
  position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
  color: rgba(255,245,230,0.7); font-size: 0.72rem; letter-spacing: 1.5px; text-align: center;
  pointer-events: none; z-index: 5; display: none; text-shadow: 0 1px 8px rgba(30,40,70,0.7);
  max-width: 90vw; line-height: 1.6;
}
</style>
</head>
<body>

<button id="panelToggle">MENU</button>
<div id="panel">
  <button class="close" id="panelClose" title="hide">✕</button>
  <h1>IMPRESSION, SUNRISE</h1>
  <div class="sub">Le Havre · 1872 · WebXR</div>
  <div class="grp"><div class="lbl">Scene</div><div class="row">
    <button class="pb" data-act="mode" data-v="globe">Globe</button>
    <button class="pb" data-act="mode" data-v="cube">Cube</button>
    <button class="pb" data-act="mode" data-v="immersive">Immersive</button>
  </div></div>
  <div class="grp"><div class="lbl">Pinch effect</div><div class="row">
    <button class="pb" data-act="pinch" data-v="whirl">Whirl</button>
    <button class="pb" data-act="pinch" data-v="gather">Gather</button>
    <button class="pb" data-act="pinch" data-v="scatter">Scatter</button>
  </div></div>
  <div class="grp"><div class="lbl">Effects</div><div class="row">
    <button class="pb" data-act="accelerate">Speed</button>
    <button class="pb" data-act="mist">Mist</button>
    <button class="pb" data-act="sunUp">Sun ↑</button>
  </div></div>
  <div class="grp"><div class="row">
    <button class="pb" data-act="menu">Hand menu</button>
    <button class="pb" data-act="recentre">Recentre</button>
  </div></div>
  <div class="row"><button class="pb wide xr" id="xrBtn">ENTER AR / VR</button></div>
  <div class="hint">Mouse — sweep · hold click — pinch · right-drag — orbit · Shift — lift sun<br>In XR: look at your open palm for the hand menu</div>
</div>

<div id="hud"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
'use strict';
// ================================================================
//  IMPRESSION, SUNRISE — WebXR brushstroke scene
//  After Claude Monet, Le Havre, 1872 (public domain)
//
//  One scene graph, built in "painting units" inside a hemisphere of
//  radius R (water disc + sky dome), shown two ways:
//   • globe     — scaled to a ~0.8 m glass dome floating in front of
//                 you (AR passthrough or VR). Pinch inside → stir.
//                 Pinch the glass → move. Two hands → scale & turn.
//   • immersive — scale 1, you stand on the quay inside the painting.
//  A palm-up hand menu (either hand) switches modes and effects.
// ================================================================

const panel = document.getElementById('panel');
const panelToggle = document.getElementById('panelToggle');
const xrBtn = document.getElementById('xrBtn');
const hud = document.getElementById('hud');

let MODE = 'globe';
let SESSION_KIND = null;   // 'ar' | 'vr' | null

// Effect settings (driven by the hand menu)
const FX = { pinch: 'whirl', accelerate: true, mist: true, sunUp: false };

// ── Renderer ─────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
renderer.outputEncoding = THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.01, 200);
camera.position.set(0, 1.6, 0);

const world = new THREE.Group();     // the painting; scaled down in globe mode
scene.add(world);

// ── Palette (sampled from the painting) ──────────────────────────
const C = (h) => new THREE.Color(h);
const PAL = {
  hazeBlue: [C(0x7a8fb5), C(0x8fa2c4), C(0x9fb0cc), C(0x6f86ad), C(0xa9b4cf)],
  hazeTeal: [C(0x7d9db0), C(0x8aa9b8)],
  peach: [C(0xe9a173), C(0xf0b088), C(0xd98a5e), C(0xe8987a), C(0xf2c39c)],
  water: [C(0x5d78a6), C(0x7590bb), C(0x94a8c6), C(0x4b6892), C(0x6a8ba2), C(0x849bc0), C(0xb6bfcf)],
  waterCream: [C(0xd9d1c2), C(0xc9c3b8)],
  sun: C(0xff4d1c),
  reflect: [C(0xff6a32), C(0xf07a3a), C(0xe85a2a), C(0xff8c48), C(0xd8552c)],
  reflectDark: [C(0x3a4f77), C(0x2f4468)],
  ink: [C(0x1b2436), C(0x25324a), C(0x2c3b58), C(0x3a4a68)],
  mast: [C(0x5c6f96), C(0x6a7ca2), C(0x53668e)],
};
const pick = (a) => a[(Math.random() * a.length) | 0];
const jitter = (c, amt) => {
  const o = c.clone();
  o.r = THREE.MathUtils.clamp(o.r + (Math.random() - 0.5) * amt, 0, 1);
  o.g = THREE.MathUtils.clamp(o.g + (Math.random() - 0.5) * amt, 0, 1);
  o.b = THREE.MathUtils.clamp(o.b + (Math.random() - 0.5) * amt, 0, 1);
  return o;
};

// ── Painting-unit geometry ───────────────────────────────────────
const R = 40;             // hemisphere radius (painting units)
const WATER_Y = -0.02;
const SUN_AZ = 0.10;      // sun slightly right of "forward" (-z)
let sunElev = 0.155, sunElevTarget = 0.155;

const GLOBE_SCALE = 0.8 / (R * 2);   // 0.8 m diameter
const globePose = { pos: new THREE.Vector3(0, 1.05, -0.55), yaw: 0, scale: 1 };
// Cube option: a diorama box around the same scene. x ±BOX_HW, y 0..BOX_H, z BOX_ZF (front) .. BOX_ZB (back)
const BOX_HW = 30, BOX_H = 30, BOX_ZF = 6, BOX_ZB = -42;
const isWidget = () => MODE === 'globe' || MODE === 'cube';
const inBox = (x, y, z) => Math.abs(x) < BOX_HW && y > -1 && y < BOX_H && z < BOX_ZF && z > BOX_ZB;
const inDisc = (x, z) => x * x + z * z < (R - 0.8) * (R - 0.8);

function applyMode() {
  if (isWidget()) {
    world.scale.setScalar(GLOBE_SCALE * globePose.scale);
    world.position.copy(globePose.pos);
    world.rotation.set(0, globePose.yaw, 0);
  } else {
    world.scale.setScalar(1); world.position.set(0, 0, 0); world.rotation.set(0, 0, 0);
  }
  world.updateMatrixWorld(true);
  skyDome.visible = MODE === 'immersive';
  bigWater.visible = MODE === 'immersive';
  globeSky.visible = MODE === 'globe';
  waterDisc.visible = MODE === 'globe';
  glass.visible = MODE === 'globe';
  base.visible = MODE === 'globe';
  backWall.visible = MODE === 'cube';
  boxFloor.visible = MODE === 'cube';
  frame.visible = MODE === 'cube';
  sky.mesh.material.uniforms.uHemiFade.value = MODE === 'globe' ? 1 : 0;
  placeSun();
  buildSky();
  buildSil();
  applyRegion();
  syncMenu();
}
// show only the strokes that fall inside the active volume (disc for globe/immersive, box for cube)
function applyRegion() {
  const test = MODE === 'cube' ? (x, y, z) => inBox(x, y, z) : (x, y, z) => inDisc(x, z);
  for (const L of [water, refl, mist]) {
    for (let i = 0; i < L.n; i++) { const i3 = i * 3; L.alpha[i] = test(L.home[i3], L.home[i3 + 1], L.home[i3 + 2]) ? L.baseAlpha[i] : 0; L.regionMask[i] = L.alpha[i] > 0 ? 1 : 0; }
    L.flush();
  }
}
const U = () => 1 / world.scale.x;   // painting units per metre

const sunPos = new THREE.Vector3();
function placeSun() {
  if (MODE === 'cube') {
    const y = THREE.MathUtils.clamp(2.5 + Math.sin(sunElev) * 60, 4, BOX_H - 3);
    sunPos.set(Math.tan(SUN_AZ) * -BOX_ZB, y, BOX_ZB + 1.2);
    sun.position.copy(sunPos); sunHalo.position.copy(sunPos);
    sun.rotation.set(0, 0, 0); sunHalo.rotation.set(0, 0, 0);
    backWall.material.uniforms.uSun.value.set(sunPos.x, sunPos.y);
    return;
  }
  const r = R - 0.6;
  sunPos.set(Math.sin(SUN_AZ) * Math.cos(sunElev) * r, Math.sin(sunElev) * r, -Math.cos(SUN_AZ) * Math.cos(sunElev) * r);
  sun.position.copy(sunPos); sunHalo.position.copy(sunPos);
  sun.lookAt(0, 0, 0); sunHalo.lookAt(0, 0, 0);
}

// ── Brushstroke shader ───────────────────────────────────────────
const vsStroke = `
  attribute vec3 iPos; attribute vec3 iCol; attribute vec2 iSize;
  attribute float iRot; attribute float iAlpha; attribute float iSeed;
  uniform float uHemiFade;
  varying vec2 vUv; varying vec3 vCol; varying float vAlpha; varying float vSeed;
  void main() {
    vUv = position.xy; vCol = iCol; vSeed = iSeed;
    vec4 c = modelViewMatrix * vec4(iPos, 1.0);
    float cs = cos(iRot), sn = sin(iRot);
    float s = length(modelMatrix[0].xyz);
    vec2 off = vec2(position.x * iSize.x, position.y * iSize.y) * s;
    off = vec2(off.x * cs - off.y * sn, off.x * sn + off.y * cs);
    c.xy += off;
    gl_Position = projectionMatrix * c;
    // globe mode: strokes on the near side of the dome fade so you can see in
    vec3 wp = (modelMatrix * vec4(iPos, 1.0)).xyz;
    vec3 ctr = (modelMatrix * vec4(0.0, 0.0, 0.0, 1.0)).xyz;
    float facing = dot(normalize(wp - ctr), normalize(cameraPosition - ctr));
    float fade = 1.0 - smoothstep(-0.15, 0.45, facing);
    vAlpha = iAlpha * mix(1.0, fade, uHemiFade);
  }`;
const fsStroke = `
  varying vec2 vUv; varying vec3 vCol; varying float vAlpha; varying float vSeed;
  float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7)) + vSeed) * 43758.5453); }
  void main() {
    vec2 q = vUv * 2.0;
    float d = q.x * q.x + q.y * q.y;
    float n = hash(floor(vUv * vec2(14.0, 5.0)));
    float edge = 1.0 - 0.28 * n;
    float a = 1.0 - smoothstep(edge * 0.30, edge, d);
    if (a * vAlpha < 0.01) discard;
    float streak = 0.97 + 0.03 * sin((vUv.x * 9.0 + vSeed) * 3.14159);
    float ends = 1.0 - 0.12 * smoothstep(0.55, 1.0, abs(q.x));
    gl_FragColor = vec4(vCol * streak * ends, a * vAlpha);
  }`;

class StrokeLayer {
  constructor(count, { blending = THREE.NormalBlending, renderOrder = 0, depthTest = true, depthWrite = false, parent = world } = {}) {
    this.n = count;
    this.home = new Float32Array(count * 3); this.pos = new Float32Array(count * 3);
    this.vel = new Float32Array(count * 3); this.col = new Float32Array(count * 3);
    this.base = new Float32Array(count * 3); this.size = new Float32Array(count * 2);
    this.rot = new Float32Array(count); this.rotHome = new Float32Array(count);
    this.alpha = new Float32Array(count); this.baseAlpha = new Float32Array(count);
    this.seed = new Float32Array(count); this.phase = new Float32Array(count); this.regionMask = new Float32Array(count).fill(1);
    const g = new THREE.InstancedBufferGeometry();
    const quad = new THREE.PlaneBufferGeometry(1, 1);
    g.index = quad.index; g.setAttribute('position', quad.getAttribute('position'));
    this.aPos = new THREE.InstancedBufferAttribute(this.pos, 3).setUsage(THREE.DynamicDrawUsage);
    this.aCol = new THREE.InstancedBufferAttribute(this.col, 3).setUsage(THREE.DynamicDrawUsage);
    this.aSize = new THREE.InstancedBufferAttribute(this.size, 2).setUsage(THREE.DynamicDrawUsage);
    this.aRot = new THREE.InstancedBufferAttribute(this.rot, 1).setUsage(THREE.DynamicDrawUsage);
    this.aAlp = new THREE.InstancedBufferAttribute(this.alpha, 1).setUsage(THREE.DynamicDrawUsage);
    this.aSeed = new THREE.InstancedBufferAttribute(this.seed, 1).setUsage(THREE.DynamicDrawUsage);
    g.setAttribute('iPos', this.aPos); g.setAttribute('iCol', this.aCol); g.setAttribute('iSize', this.aSize);
    g.setAttribute('iRot', this.aRot); g.setAttribute('iAlpha', this.aAlp); g.setAttribute('iSeed', this.aSeed);
    g.instanceCount = count;
    const m = new THREE.ShaderMaterial({
      vertexShader: vsStroke, fragmentShader: fsStroke, uniforms: { uHemiFade: { value: 0 } },
      transparent: true, depthWrite, depthTest, blending, side: THREE.DoubleSide,
    });
    this.mesh = new THREE.Mesh(g, m);
    this.mesh.frustumCulled = false; this.mesh.renderOrder = renderOrder;
    parent.add(this.mesh);
  }
  set(i, x, y, z, color, w, h, rot, alpha) {
    const i3 = i * 3;
    this.home[i3] = this.pos[i3] = x; this.home[i3 + 1] = this.pos[i3 + 1] = y; this.home[i3 + 2] = this.pos[i3 + 2] = z;
    this.vel[i3] = this.vel[i3 + 1] = this.vel[i3 + 2] = 0;
    this.base[i3] = this.col[i3] = color.r; this.base[i3 + 1] = this.col[i3 + 1] = color.g; this.base[i3 + 2] = this.col[i3 + 2] = color.b;
    this.size[i * 2] = w; this.size[i * 2 + 1] = h;
    this.rotHome[i] = this.rot[i] = rot; this.alpha[i] = this.baseAlpha[i] = alpha;
    this.seed[i] = Math.random() * 100; this.phase[i] = Math.random() * Math.PI * 2;
  }
  flush(all = false) {
    this.aPos.needsUpdate = this.aCol.needsUpdate = this.aRot.needsUpdate = this.aAlp.needsUpdate = true;
    if (all) this.aSize.needsUpdate = this.aSeed.needsUpdate = true;
  }
}

// ── Backdrops ────────────────────────────────────────────────────
const skyFS = `
  varying vec3 vP; uniform vec3 uSun; uniform float uWarm;
  void main(){
    vec3 d = normalize(vP); float el = d.y;
    vec3 low = vec3(0.663,0.714,0.812), mid = vec3(0.541,0.612,0.741), high = vec3(0.478,0.549,0.714);
    vec3 sky = mix(low, mid, smoothstep(-0.05, 0.18, el)); sky = mix(sky, high, smoothstep(0.18, 0.7, el));
    vec3 sd = normalize(uSun);
    float az = max(0.0, dot(normalize(vec3(d.x,0.0,d.z)), normalize(vec3(sd.x,0.0,sd.z))));
    float warm = smoothstep(0.05, 0.45, el) * (0.35 + 0.65 * pow(az, 1.5)) * uWarm;
    sky = mix(sky, vec3(0.905,0.612,0.435), warm * 0.42);
    float g = pow(max(0.0, dot(d, sd)), 140.0);
    sky = mix(sky, vec3(0.95,0.60,0.42), g * 0.5);
    gl_FragColor = vec4(sky, 1.0);
  }`;
const skyVS = `varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`;
const mkSky = (radius) => {
  const m = new THREE.Mesh(new THREE.SphereGeometry(radius, 48, 24, 0, Math.PI * 2, 0, Math.PI * 0.52),
    new THREE.ShaderMaterial({ side: THREE.BackSide, depthWrite: false, uniforms: { uSun: { value: sunPos }, uWarm: { value: 1.0 } }, vertexShader: skyVS, fragmentShader: skyFS }));
  m.renderOrder = -10; world.add(m); return m;
};
const skyDome = mkSky(150);     // immersive
const globeSky = mkSky(R);      // globe

const waterVS = `varying vec2 vL; void main(){ vL = position.xy; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`;
const waterFS = `
  varying vec2 vL; uniform float uR;
  void main(){
    float far = clamp(vL.y / uR, 0.0, 1.0), back = clamp(-vL.y / uR, 0.0, 1.0);
    vec3 near = vec3(0.400,0.510,0.660), farc = vec3(0.620,0.690,0.800);
    vec3 c = mix(near, farc, pow(max(far, back * 0.7), 0.7));
    float col = exp(-abs(vL.x - 0.1 * vL.y) * 1.2) * far;
    c = mix(c, vec3(0.72,0.55,0.45), col * 0.18);
    gl_FragColor = vec4(c, 1.0);
  }`;
const mkWater = (geo, r) => {
  const m = new THREE.Mesh(geo, new THREE.ShaderMaterial({ depthWrite: false, uniforms: { uR: { value: r } }, vertexShader: waterVS, fragmentShader: waterFS }));
  m.rotation.x = -Math.PI / 2; m.position.y = WATER_Y - 0.01; m.renderOrder = -9; world.add(m); return m;
};
const bigWater = mkWater(new THREE.PlaneGeometry(400, 400), 60);
const waterDisc = mkWater(new THREE.CircleGeometry(R, 64), R);

// Glass dome + base (globe mode)
const glass = new THREE.Mesh(new THREE.SphereGeometry(R + 0.6, 64, 32, 0, Math.PI * 2, 0, Math.PI * 0.5), new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, side: THREE.FrontSide,
  uniforms: { uGlow: { value: 0.0 } },
  vertexShader: `varying vec3 vN; varying vec3 vW; void main(){ vN = normalize(mat3(modelMatrix) * normal); vW = (modelMatrix*vec4(position,1.0)).xyz; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `
    varying vec3 vN; varying vec3 vW; uniform float uGlow;
    void main(){
      vec3 v = normalize(cameraPosition - vW);
      float fr = pow(1.0 - max(0.0, dot(normalize(vN), v)), 3.0);
      vec3 col = mix(vec3(0.85, 0.9, 1.0), vec3(1.0, 0.72, 0.5), uGlow);
      gl_FragColor = vec4(col, 0.05 + fr * (0.45 + uGlow * 0.4));
    }`
}));
glass.renderOrder = 12; world.add(glass);
const base = new THREE.Group(); world.add(base);
{
  const ring = new THREE.Mesh(new THREE.CylinderGeometry(R + 1.8, R + 2.6, 1.6, 64), new THREE.MeshBasicMaterial({ color: 0x1b2436 }));
  ring.position.y = -0.8 - 0.01; base.add(ring);
  const lip = new THREE.Mesh(new THREE.TorusGeometry(R + 1.2, 0.35, 8, 64), new THREE.MeshBasicMaterial({ color: 0xc9b58a }));
  lip.rotation.x = Math.PI / 2; lip.position.y = 0.05; base.add(lip);
}

// Cube backdrops: back wall gradient, box floor, frame edges
const backWall = new THREE.Mesh(new THREE.PlaneGeometry(BOX_HW * 2, BOX_H), new THREE.ShaderMaterial({
  depthWrite: false,
  uniforms: { uSun: { value: new THREE.Vector2(0, 10) }, uH: { value: BOX_H }, uWarm: { value: 1.0 } },
  vertexShader: `varying vec2 vL; void main(){ vL = position.xy; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `
    varying vec2 vL; uniform vec2 uSun; uniform float uH; uniform float uWarm;
    void main(){
      float y = (vL.y + uH * 0.5) / uH;
      vec3 low = vec3(0.663,0.714,0.812), mid = vec3(0.541,0.612,0.741), high = vec3(0.478,0.549,0.714);
      vec3 sky = mix(low, mid, smoothstep(0.0, 0.35, y)); sky = mix(sky, high, smoothstep(0.35, 1.0, y));
      float dx = (vL.x - uSun.x) / 40.0;
      float warm = smoothstep(0.25, 0.9, y) * (0.35 + 0.65 * exp(-dx * dx * 2.0)) * uWarm;
      sky = mix(sky, vec3(0.905,0.612,0.435), warm * 0.42);
      float g = exp(-length(vec2(vL.x - uSun.x, vL.y + uH * 0.5 - uSun.y)) * 0.12);
      sky = mix(sky, vec3(0.95,0.60,0.42), g * 0.5);
      gl_FragColor = vec4(sky, 1.0);
    }`
}));
backWall.position.set(0, BOX_H / 2, BOX_ZB); backWall.renderOrder = -10; world.add(backWall);
const boxFloor = mkWater(new THREE.PlaneGeometry(BOX_HW * 2, BOX_ZF - BOX_ZB), 30);
boxFloor.position.z = (BOX_ZF + BOX_ZB) / 2;

  } else {
    camera.position.set(Math.sin(t * 0.1) * 0.08, 1.6 + Math.sin(t * 0.13) * 0.02, 0);
    camera.lookAt(sunPos.x * 0.15, 1.9, -20);
  }
}
function desktopLoop() {
  const dt = tick(), t = clock.getElapsedTime();
  desktopCamera(t);
  if (mouseHand) { hands.right.pinch = mouseDown && !desktopPointer ? 1 : 0; hands.right.active = true; }
  update(dt, t);
  hands.right.vel.multiplyScalar(0.85);
  renderer.render(scene, camera);
}

const raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2(), hitPt = new THREE.Vector3();
const floorPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -0.25);
const wallPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 2.2);
renderer.domElement.addEventListener('mousemove', e => {
  if (rightDown) { orbit += (e.clientX - lastMX) * 0.01; lastMX = e.clientX; }
  if (!mouseHand) return;
  ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  desktopPointer = null;
  if (desktopMenu && menu.visible) {
    const hits = raycaster.intersectObjects(buttons.map(b => b.mesh));
    if (hits.length) { desktopPointer = hits[0].point.clone().add(new THREE.Vector3(0, 0, 0)); desktopPointer._btn = hits[0].object; }
  }
  let plane;
  if (isWidget()) { const c = globeCentre(); plane = new THREE.Plane().setFromNormalAndCoplanarPoint(camera.position.clone().sub(c).normalize(), c); }
  else plane = ndc.y < -0.05 ? floorPlane : wallPlane;
  if (raycaster.ray.intersectPlane(plane, hitPt)) {
    const H = hands.right;
    if (MODE === 'immersive' && hitPt.z < -6) hitPt.multiplyScalar(6 / -hitPt.z);
    H.prev.copy(H.pos); H.pos.copy(hitPt); H.pinchPt.copy(hitPt);
    H.vel.copy(H.pos).sub(H.prev).multiplyScalar(30);
  }
});
renderer.domElement.addEventListener('mousedown', e => {
  if (e.button === 2) { rightDown = true; lastMX = e.clientX; return; }
  if (desktopPointer && desktopPointer._btn) { const b = buttons.find(x => x.mesh === desktopPointer._btn); if (b) { b.onPress(); syncMenu(); } return; }
  mouseDown = true;
});
renderer.domElement.addEventListener('mouseup', e => { if (e.button === 2) rightDown = false; else mouseDown = false; });
renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('keydown', e => {
  if (e.key === 'Shift') sunElevTarget = 0.4;
  if (e.key === 'm' || e.key === 'M') { desktopMenu = !desktopMenu; syncPanel(); }
});
window.addEventListener('keyup', e => { if (e.key === 'Shift') sunElevTarget = FX.sunUp ? 0.42 : 0.155; });

// ── UI: on-page control panel (shares state with the 3D hand menu) ──
const DESKTOP_HUD = 'M — hand menu &nbsp;·&nbsp; Move the mouse — sweep &nbsp;·&nbsp; Hold click — pinch &nbsp;·&nbsp; Right-drag — orbit &nbsp;·&nbsp; Shift — lift the sun';
function applyClear() {
  if (SESSION_KIND === 'ar' && isWidget()) renderer.setClearColor(0x000000, 0);
  else if (MODE === 'immersive') renderer.setClearColor(0x8ea3c4, 1);
  else renderer.setClearColor(0x1a1d27, 1);
}
function setMode(m) { MODE = m; applyClear(); applyMode(); syncPanel(); }
function setPinch(v) { FX.pinch = v; syncMenu(); syncPanel(); }
function toggleFX(k) {
  FX[k] = !FX[k];
  if (k === 'mist') mist.mesh.visible = FX.mist;
  if (k === 'sunUp') sunElevTarget = FX.sunUp ? 0.42 : 0.155;
  syncMenu(); syncPanel();
}
function syncPanel() {
  panel.querySelectorAll('.pb[data-act]').forEach(b => {
    const a = b.dataset.act, v = b.dataset.v;
    let on = false;
    if (a === 'mode') on = MODE === v; else if (a === 'pinch') on = FX.pinch === v;
    else if (a === 'menu') on = desktopMenu; else if (a in FX) on = !!FX[a];
    b.classList.toggle('on', on);
  });
  xrBtn.textContent = xrBtn.disabled ? xrBtn.textContent : (isWidget() ? 'ENTER AR / VR' : 'ENTER VR');
}
panel.addEventListener('click', e => {
  const b = e.target.closest('.pb[data-act]'); if (!b) return;
  const a = b.dataset.act, v = b.dataset.v;
  if (a === 'mode') setMode(v);
  else if (a === 'pinch') setPinch(v);
  else if (a === 'menu') { desktopMenu = !desktopMenu; syncPanel(); }
  else if (a === 'recentre') recentreGlobe();
  else toggleFX(a);
});
document.getElementById('panelClose').addEventListener('click', () => { panel.style.display = 'none'; panelToggle.style.display = 'block'; });
panelToggle.addEventListener('click', () => { panel.style.display = 'block'; panelToggle.style.display = 'none'; });
xrBtn.addEventListener('click', startXR);
window.addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

(async () => {
  if (!navigator.xr) { xrBtn.disabled = true; xrBtn.textContent = 'WebXR Unavailable'; return; }
  const ar = await navigator.xr.isSessionSupported('immersive-ar').catch(() => false);
  const vr = await navigator.xr.isSessionSupported('immersive-vr').catch(() => false);
  if (!ar && !vr) { xrBtn.disabled = true; xrBtn.textContent = 'XR Not Supported'; }
})();

renderer.setClearColor(0x1a1d27, 1);
applyMode();
syncPanel();
hud.style.display = 'block'; hud.innerHTML = DESKTOP_HUD;
mouseHand = true;
renderer.setAnimationLoop(desktopLoop);
</script>
</body>
</html>
