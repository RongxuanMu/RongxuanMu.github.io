<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathViz AI 实验室 - 专业工作站版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #020617; color: white; font-family: 'Inter', sans-serif; }
        .app-container { display: flex; height: 100vh; width: 100vw; position: relative; }
        
        /* 侧边栏优化 */
        #sidebar { 
            width: 25%; min-width: 260px; max-width: 40%;
            background: #0f172a; border-right: 1px solid rgba(255,255,255,0.1);
            display: flex; flex-direction: column;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative; z-index: 30;
        }
        #sidebar.folded { width: 0 !important; min-width: 0 !important; overflow: hidden; border-right: none; }

        /* 拖拽条 */
        #resizer { width: 4px; cursor: col-resize; background: rgba(255,255,255,0.05); z-index: 40; transition: background 0.2s; }
        #resizer:hover, #resizer.dragging { background: #3b82f6; }

        /* 主视窗 */
        #main-view { flex-grow: 1; position: relative; background: radial-gradient(circle at center, #0f172a 0%, #020617 100%); overflow: hidden; }

        /* 右侧合一面板 */
        .floating-console {
            position: absolute; top: 1rem; right: 1rem; width: 300px;
            z-index: 50; pointer-events: none;
            display: flex; flex-direction: column;
        }
        .glass-panel {
            pointer-events: auto;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 1rem;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            display: flex; flex-direction: column;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .panel-header {
            padding: 0.75rem 1rem;
            display: flex; justify-content: space-between; align-items: center;
            cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05);
            user-select: none;
        }
        .panel-content {
            padding: 1rem; max-height: calc(100vh - 6rem); overflow-y: auto;
            transition: max-height 0.3s ease, padding 0.3s ease, opacity 0.2s ease;
        }
        .glass-panel.collapsed .panel-content {
            max-height: 0; padding: 0 1rem; opacity: 0; border-bottom: none;
        }

        /* 加载效果 */
        #loading-overlay {
            position: absolute; inset: 0; background: rgba(2, 6, 23, 0.5);
            backdrop-filter: blur(6px); z-index: 60;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        #loading-overlay.active { opacity: 1; pointer-events: auto; }
        .loader-ring {
            width: 40px; height: 40px; border: 3px solid rgba(59, 130, 246, 0.1);
            border-top: 3px solid #3b82f6; border-radius: 50%; animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* 其它组件 */
        input[type="range"] { accent-color: #3b82f6; cursor: pointer; height: 4px; -webkit-appearance: none; background: #334155; border-radius: 2px; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
        #formula-display .katex-display { margin: 0.2em 0; font-size: 1.05em; color: #e2e8f0; }

        /* 折叠按钮 */
        #fold-toggle {
            position: absolute; left: 100%; top: 20px;
            background: #0f172a; border: 1px solid rgba(255,255,255,0.1); border-left: none;
            padding: 0.8rem 0.25rem; border-radius: 0 0.5rem 0.5rem 0;
            cursor: pointer; z-index: 100; transition: transform 0.3s ease;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- 侧边栏 -->
        <aside id="sidebar">
            <button id="fold-toggle" class="interactive">
                <svg id="fold-icon" xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                </svg>
            </button>
            
            <div class="p-4 flex flex-col h-full overflow-hidden">
                <div class="flex items-center gap-2 mb-4">
                    <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
                    </div>
                    <div>
                        <h2 class="text-xs font-black text-white uppercase italic leading-none">Math Engine</h2>
                        <p class="text-[7px] text-blue-400 font-bold tracking-widest uppercase">Visual AI Lab</p>
                    </div>
                </div>

                <!-- 交互输入 -->
                <section class="mb-4">
                    <div class="bg-slate-800/50 rounded-xl p-1.5 border border-white/5 flex items-center gap-1.5 focus-within:border-blue-500/50 transition-all">
                        <button id="mic-btn" class="w-8 h-8 rounded-lg flex items-center justify-center transition-all hover:bg-slate-700">
                            <svg id="mic-icon" xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
                            </svg>
                        </button>
                        <input type="text" id="user-input" 
                            class="bg-transparent flex-1 text-xs text-white outline-none py-1 placeholder:text-slate-600"
                            placeholder="输入指令或说话...">
                        <button id="send-btn" class="w-8 h-8 bg-blue-600 text-white rounded-lg flex items-center justify-center hover:bg-blue-500">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" /></svg>
                        </button>
                    </div>
                    <div id="ai-response" class="mt-2 px-3 py-2 text-[9px] text-slate-500 hidden rounded-lg bg-blue-500/5 border-l border-blue-500"></div>
                </section>

                <!-- 预设列表 -->
                <div class="flex-1 overflow-y-auto custom-scrollbar pr-1">
                    <h3 class="text-[8px] font-black text-slate-600 uppercase tracking-widest mb-2 px-1">预设实验</h3>
                    <div class="grid grid-cols-1 gap-1">
                        <button onclick="quickAction('画一个带振幅a和频率b的正弦函数')" class="text-left p-3 rounded-lg bg-slate-800/20 hover:bg-slate-800/40 border border-white/5 transition-all">
                            <span class="block text-[10px] font-bold text-slate-400 group-hover:text-blue-400">正弦图像 (2D)</span>
                        </button>
                        <button onclick="quickAction('交互式马鞍面 z=k*(x^2-y^2)')" class="text-left p-3 rounded-lg bg-slate-800/20 hover:bg-slate-800/40 border border-white/5 transition-all">
                            <span class="block text-[10px] font-bold text-slate-400 group-hover:text-emerald-400">马鞍曲面 (3D)</span>
                        </button>
                        <button onclick="quickAction('动态参数的三维螺旋线')" class="text-left p-3 rounded-lg bg-slate-800/20 hover:bg-slate-800/40 border border-white/5 transition-all">
                            <span class="block text-[10px] font-bold text-slate-400 group-hover:text-yellow-400">三维螺旋 (Curve)</span>
                        </button>
                        <button onclick="quickAction('切割球体控制偏移')" class="text-left p-3 rounded-lg bg-slate-800/20 hover:bg-slate-800/40 border border-white/5 transition-all">
                            <span class="block text-[10px] font-bold text-slate-400 group-hover:text-red-400">几何切割 (Clipping)</span>
                        </button>
                    </div>
                </div>

                <div class="pt-2 mt-auto border-t border-white/5">
                    <div id="status-msg" class="text-[8px] font-bold uppercase tracking-widest text-blue-500/40">Ready</div>
                </div>
            </div>
        </aside>

        <!-- 拖拽边界 -->
        <div id="resizer"></div>

        <!-- 3D 主视窗 -->
        <main id="main-view">
            <div id="canvas-container" class="w-full h-full"></div>

            <!-- 加载遮罩 -->
            <div id="loading-overlay">
                <div class="loader-ring"></div>
                <p class="mt-3 text-[9px] font-bold uppercase tracking-widest text-blue-500">AI 正在数学建模</p>
            </div>

            <!-- 右侧整合控制面板 -->
            <div class="floating-console">
                <div id="merged-panel" class="glass-panel hidden">
                    <header class="panel-header" id="panel-toggle">
                        <div class="flex items-center gap-2">
                            <div class="w-1.5 h-1.5 bg-blue-500 rounded-full"></div>
                            <span class="text-[9px] font-black text-slate-300 uppercase tracking-widest">模型控制台</span>
                        </div>
                        <svg id="panel-arrow" xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 text-slate-500 transition-transform duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                        </svg>
                    </header>
                    
                    <div class="panel-content custom-scrollbar" id="panel-inner">
                        <!-- 公式区 -->
                        <div id="formula-section" class="mb-6">
                            <div id="formula-display"></div>
                        </div>
                        
                        <!-- 参数调节区 -->
                        <div id="controls-section">
                            <h4 class="text-[8px] font-bold text-slate-500 uppercase tracking-[0.2em] mb-4">参数矩阵</h4>
                            <div id="dynamic-sliders" class="space-y-5"></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const apiKey = "";
        let scene, camera, renderer, controls, currentObject = null;
        let isListening = false;
        let currentMetadata = null; 
        let currentVariables = {}; 

        // 布局控制
        function initLayout() {
            const sidebar = document.getElementById('sidebar');
            const resizer = document.getElementById('resizer');
            const toggle = document.getElementById('fold-toggle');
            const foldIcon = document.getElementById('fold-icon');
            const panel = document.getElementById('merged-panel');
            const panelToggle = document.getElementById('panel-toggle');
            const panelArrow = document.getElementById('panel-arrow');
            
            let isDragging = false;

            // 侧边栏拖拽
            resizer.addEventListener('mousedown', () => { isDragging = true; resizer.classList.add('dragging'); });
            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                const newWidth = e.clientX;
                if (newWidth > 200 && newWidth < window.innerWidth * 0.5) {
                    sidebar.style.width = `${newWidth}px`;
                    onWindowResize();
                }
            });
            document.addEventListener('mouseup', () => { isDragging = false; resizer.classList.remove('dragging'); });

            // 侧边栏折叠
            toggle.addEventListener('click', () => {
                const folded = sidebar.classList.toggle('folded');
                resizer.style.opacity = folded ? '0' : '1';
                resizer.style.pointerEvents = folded ? 'none' : 'auto';
                foldIcon.style.transform = folded ? 'rotate(180deg)' : 'rotate(0deg)';
                setTimeout(onWindowResize, 310);
            });

            // 右侧面板折叠
            panelToggle.addEventListener('click', () => {
                const isCollapsed = panel.classList.toggle('collapsed');
                panelArrow.style.transform = isCollapsed ? 'rotate(-90deg)' : 'rotate(0deg)';
            });
        }

        function toggleLoading(active) {
            document.getElementById('loading-overlay').classList.toggle('active', active);
        }

        function initThree() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 2000);
            camera.position.set(12, 12, 12);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.localClippingEnabled = true;
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            scene.add(new THREE.AmbientLight(0xffffff, 0.5));
            const sun = new THREE.DirectionalLight(0xffffff, 0.8);
            sun.position.set(10, 20, 10);
            scene.add(sun);

            const grid = new THREE.GridHelper(40, 40, 0x334155, 0x1e293b);
            grid.material.opacity = 0.3;
            grid.material.transparent = true;
            scene.add(grid);

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function onWindowResize() {
            const container = document.getElementById('canvas-container');
            if (!container) return;
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        // 安全编译辅助函数
        function safeCompile(expr, fallback = "0") {
            if (typeof expr !== 'string' || expr.trim() === "") {
                return math.compile(fallback);
            }
            try {
                return math.compile(expr);
            } catch (e) {
                console.error("Math compilation failed for:", expr, e);
                return math.compile(fallback);
            }
        }

        // AI 解析
        async function processInput(text) {
            if (!text || text.trim() === "") return;
            showStatus("AI Analyzing...");
            toggleLoading(true);
            
            const systemPrompt = `
                你是一个数学可视化专家。将用户指令转为 JSON。
                1. type: "plot", "curveParametric", "surfaceParametric", "shape3D"
                2. params: 包含公式和 controls 数组。
                3. latexTemplate: LaTeX 模板，变量用 {name}。
                返回纯 JSON 格式。
            `;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `指令: "${text}"` }] }],
                        systemInstruction: { parts: [{ text: systemPrompt }] },
                        generationConfig: { responseMimeType: "application/json" }
                    })
                });

                const data = await response.json();
                const result = JSON.parse(data.candidates[0].content.parts[0].text);
                
                currentMetadata = result;
                setupMergedUI(result);
                renderVisualization(result);
                
                const resEl = document.getElementById('ai-response');
                resEl.innerText = result.explanation || "";
                resEl.classList.remove('hidden');
                showStatus("Synchronized");
            } catch (error) {
                console.error(error);
                showStatus("Engine Error");
            } finally {
                toggleLoading(false);
            }
        }

        function setupMergedUI(data) {
            const sliderBox = document.getElementById('dynamic-sliders');
            sliderBox.innerHTML = '';
            currentVariables = {};
            document.getElementById('merged-panel').classList.remove('hidden', 'collapsed');
            document.getElementById('panel-arrow').style.transform = 'rotate(0deg)';

            if (data.params && data.params.controls) {
                data.params.controls.forEach(ctrl => {
                    currentVariables[ctrl.name] = ctrl.value;
                    const div = document.createElement('div');
                    div.innerHTML = `
                        <div class="flex justify-between items-center mb-1.5">
                            <span class="text-[9px] text-slate-500 font-bold uppercase tracking-wider">${ctrl.label}</span>
                            <span id="val-${ctrl.name}" class="text-[10px] font-mono text-blue-400 font-bold">${ctrl.value}</span>
                        </div>
                        <input type="range" class="w-full" min="${ctrl.min}" max="${ctrl.max}" step="${ctrl.step}" value="${ctrl.value}" 
                               oninput="updateVariable('${ctrl.name}', this.value)">
                    `;
                    sliderBox.appendChild(div);
                });
            }
            updateFormulaDisplay();
        }

        function updateVariable(name, val) {
            currentVariables[name] = parseFloat(val);
            const displayVal = document.getElementById(`val-${name}`);
            if (displayVal) displayVal.innerText = val;
            updateFormulaDisplay();
            if (currentMetadata) renderVisualization(currentMetadata, true);
        }

        function updateFormulaDisplay() {
            if (!currentMetadata || !currentMetadata.latexTemplate) return;
            let latex = currentMetadata.latexTemplate;
            Object.keys(currentVariables).forEach(key => {
                const val = currentVariables[key];
                latex = latex.replace(new RegExp(`{${key}}`, 'g'), (typeof val === 'number' ? val.toFixed(2) : "0.00"));
            });
            const container = document.getElementById('formula-display');
            if (container) katex.render(latex, container, { throwOnError: false, displayMode: true });
        }

        function renderVisualization(data, isUpdate = false) {
            if (currentObject) {
                scene.remove(currentObject);
                if (!isUpdate && currentObject.geometry) currentObject.geometry.dispose();
            }
            try {
                switch(data.type) {
                    case "plot": drawPlot(data.params, isUpdate); break;
                    case "curveParametric": drawCurve(data.params, isUpdate); break;
                    case "surfaceParametric": drawSurface(data.params, isUpdate); break;
                    case "shape3D": drawShape(data.params, isUpdate); break;
                }
            } catch (e) { console.error(e); }
        }

        // --- 核心渲染引擎 ---
        function drawPlot(p, isUpdate) {
            const points = [];
            const compiled = safeCompile(p.formula);
            for (let x = -15; x <= 15; x += 0.05) {
                try {
                    const y = compiled.evaluate({ ...currentVariables, x });
                    if (isFinite(y)) points.push(new THREE.Vector3(x, y, 0));
                } catch(e) {}
            }
            currentObject = new THREE.Line(new THREE.BufferGeometry().setFromPoints(points), 
                new THREE.LineBasicMaterial({ color: 0x60a5fa, linewidth: 2 }));
            scene.add(currentObject);
            if(!isUpdate) resetCam({x:0, y:0, z:22});
        }

        function drawCurve(p, isUpdate) {
            const points = [];
            const cx = safeCompile(p.xFunc, "t"); 
            const cy = safeCompile(p.yFunc, "t"); 
            const cz = safeCompile(p.zFunc, "0");
            for (let t = 0; t <= 40; t += 0.05) {
                try {
                    const vars = { ...currentVariables, t, x: t, y: t, z: t };
                    points.push(new THREE.Vector3(cx.evaluate(vars), cz.evaluate(vars), cy.evaluate(vars)));
                } catch(e) {}
            }
            currentObject = new THREE.Line(new THREE.BufferGeometry().setFromPoints(points), 
                new THREE.LineBasicMaterial({ color: 0xfacc15, linewidth: 3 }));
            scene.add(currentObject);
            if(!isUpdate) resetCam({x:18, y:18, z:18});
        }

        function drawSurface(p, isUpdate) {
            const segs = 65;
            const vertices = []; const indices = [];
            const cx = safeCompile(p.xFunc, "u"); 
            const cy = safeCompile(p.yFunc, "v"); 
            const cz = safeCompile(p.zFunc, "0");
            for (let i = 0; i <= segs; i++) {
                const u = -6 + (i/segs)*12;
                for (let j = 0; j <= segs; j++) {
                    const v = -6 + (j/segs)*12;
                    const vars = { ...currentVariables, u, v, x: u, y: v };
                    try {
                        vertices.push(cx.evaluate(vars), cz.evaluate(vars), cy.evaluate(vars));
                    } catch(e) {
                        vertices.push(0, 0, 0);
                    }
                }
            }
            for (let i = 0; i < segs; i++) {
                for (let j = 0; j < segs; j++) {
                    const a = i*(segs+1)+j; const b = i*(segs+1)+j+1; const c = (i+1)*(segs+1)+j; const d = (i+1)*(segs+1)+j+1;
                    indices.push(a, b, d, a, d, c);
                }
            }
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            geo.setIndex(indices); geo.computeVertexNormals();
            const mat = new THREE.MeshPhysicalMaterial({
                color: 0x3b82f6, side: THREE.DoubleSide, metalness: 0.1, roughness: 0.4,
                transparent: true, opacity: 0.85, clearcoat: 1
            });
            currentObject = new THREE.Mesh(geo, mat);
            scene.add(currentObject);
            if(!isUpdate) resetCam({x:14, y:16, z:14});
        }

        function drawShape(p, isUpdate) {
            let geo;
            if(p.type === 'sphere') geo = new THREE.SphereGeometry(5, 64, 64);
            else if(p.type === 'cylinder') geo = new THREE.CylinderGeometry(4, 4, 8, 32);
            else geo = new THREE.BoxGeometry(6, 6, 6);
            const normal = new THREE.Vector3(...(p.sliceNormal || [0, 1, 0])).normalize();
            const offset = currentVariables.offset || 0;
            const mat = new THREE.MeshPhysicalMaterial({ color: 0x10b981, side: THREE.DoubleSide, 
                clippingPlanes: p.slice ? [new THREE.Plane(normal, offset)] : [], clipShadows: true });
            currentObject = new THREE.Mesh(geo, mat);
            scene.add(currentObject);
            if(!isUpdate) resetCam({x:15, y:15, z:15});
        }

        function resetCam(p) {
            camera.position.set(p.x, p.y, p.z);
            controls.target.set(0, 0, 0);
            controls.update();
        }

        // --- 语音支持 ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const rec = new SpeechRecognition();
            rec.lang = 'zh-CN'; rec.interimResults = true;
            rec.onstart = () => { isListening = true; updateMicUI(); showStatus("Listening..."); };
            rec.onresult = (e) => { 
                let interim = '', final = '';
                for (let i = e.resultIndex; i < e.results.length; ++i) {
                    if (e.results[i].isFinal) final += e.results[i][0].transcript;
                    else interim += e.results[i][0].transcript;
                }
                const inputEl = document.getElementById('user-input');
                if (final) { inputEl.value = final; processInput(final); }
                else { inputEl.value = interim; }
            };
            rec.onend = () => { isListening = false; updateMicUI(); };
            document.getElementById('mic-btn').onclick = () => isListening ? rec.stop() : rec.start();
        }

        function updateMicUI() {
            document.getElementById('mic-btn').classList.toggle('pulse-mic', isListening);
        }

        function showStatus(msg) {
            const el = document.getElementById('status-msg');
            el.innerText = msg; el.style.opacity = 1;
            if(!isListening && !msg.includes("...")) setTimeout(() => el.style.opacity = 0.4, 3000);
        }

        document.getElementById('send-btn').onclick = () => processInput(document.getElementById('user-input').value);
        document.getElementById('user-input').onkeypress = (e) => e.key === 'Enter' && processInput(e.target.value);
        function quickAction(t) { document.getElementById('user-input').value = t; processInput(t); }

        window.onload = () => { initLayout(); initThree(); };
    </script>
</body>
</html>
