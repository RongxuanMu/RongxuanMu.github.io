<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometria</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #020617; color: white; font-family: 'Inter', 'Microsoft YaHei', sans-serif; }
        .main-layout { display: flex; height: 100vh; width: 100vw; }
        
        /* 侧边栏样式 - 固定宽度，不遮挡画布 */
        .sidebar { 
            width: 380px; 
            flex-shrink: 0;
            background: #0f172a; 
            border-right: 1px solid rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
            z-index: 20;
            box-shadow: 10px 0 30px rgba(0,0,0,0.5);
        }
        
        /* 画布容器 - 占据剩余空间 */
        #canvas-container { 
            flex-grow: 1;
            position: relative;
            background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
        }

        .pulse-mic { animation: pulse-mic 1.5s infinite; }
        @keyframes pulse-mic {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        input[type="range"] { accent-color: #3b82f6; cursor: pointer; height: 4px; -webkit-appearance: none; background: #334155; border-radius: 2px; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; background: #fff; border: 2px solid #3b82f6; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
        
        #formula-display .katex-display { margin: 0.5em 0; font-size: 1.15em; color: #94a3b8; }
        
        /* Fullscreen button */
        .main-layout {
            position: relative;
        }
        
        #fullscreen-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 100;
            width: 40px;
            height: 40px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        #fullscreen-btn:hover {
            background: rgba(15, 23, 42, 0.95);
            border-color: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }
        
        #fullscreen-btn.hidden {
            display: none;
        }
        
        /* Ensure main layout fills fullscreen */
        .main-layout:fullscreen,
        .main-layout:-webkit-full-screen,
        .main-layout:-moz-full-screen,
        .main-layout:-ms-fullscreen {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>

    <div class="main-layout">
        <!-- 侧边栏 -->
        <aside class="sidebar p-6 overflow-hidden">
            <div class="flex items-center gap-3 mb-8">
                <div class="w-10 h-10 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-xl flex items-center justify-center shadow-lg shadow-blue-500/20">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                    </svg>
                </div>
                <div>
                    <h2 class="text-base font-black tracking-tight text-white uppercase italic">Geometria</h2>
                    <p class="text-[9px] text-blue-400 font-bold uppercase tracking-[0.2em]">Visual Intelligence</p>
                </div>
            </div>

            <!-- 输入区域 -->
            <section class="mb-8">
                <div class="bg-slate-800/50 rounded-2xl p-2 border border-white/5 flex items-center gap-2 focus-within:border-blue-500/50 transition-colors">
                    <button id="mic-btn" class="w-11 h-11 shrink-0 rounded-xl flex items-center justify-center transition-all hover:bg-slate-700">
                        <svg id="mic-icon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
                        </svg>
                    </button>
                    <input type="text" id="user-input" 
                        class="bg-transparent flex-1 text-sm text-white outline-none py-2 px-1 placeholder:text-slate-500"
                        placeholder="尝试：'交互式马鞍面'...">
                    <button id="send-btn" class="w-11 h-11 shrink-0 bg-blue-600 text-white rounded-xl flex items-center justify-center hover:bg-blue-500 active:scale-90 transition-all">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" /></svg>
                    </button>
                </div>
                <div id="ai-response" class="mt-4 px-4 py-3 text-xs text-slate-400 hidden rounded-xl bg-blue-500/5 border-l-4 border-blue-500 font-medium leading-relaxed"></div>
            </section>

            <!-- 滚动调节区 -->
            <div class="flex-1 overflow-y-auto custom-scrollbar pr-2 space-y-10">
                <div id="formula-section" class="hidden animate-in fade-in slide-in-from-top-2 duration-500">
                    <h3 class="text-[10px] font-black text-slate-500 uppercase tracking-[0.15em] mb-4">定义方程</h3>
                    <div id="formula-display" class="bg-black/20 rounded-2xl p-4 flex items-center justify-center min-h-[100px] border border-white/5"></div>
                </div>

                <div id="controls-section" class="hidden animate-in fade-in slide-in-from-top-4 duration-700">
                    <h3 class="text-[10px] font-black text-slate-500 uppercase tracking-[0.15em] mb-6">实时参数调节</h3>
                    <div id="dynamic-sliders" class="space-y-8"></div>
                </div>

                <div class="pt-2">
                    <h3 class="text-[10px] font-black text-slate-500 uppercase tracking-[0.15em] mb-4">快捷实验室</h3>
                    <div class="grid grid-cols-1 gap-3">
                        <button onclick="quickAction('画一个带振幅a和频率b的正弦函数')" class="flex items-center justify-between p-4 rounded-2xl bg-slate-800/30 hover:bg-slate-800 border border-white/5 group transition-all">
                            <span class="text-xs font-bold text-slate-300 group-hover:text-blue-400">交互式正弦波</span>
                            <svg class="w-4 h-4 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
                        </button>
                        <button onclick="quickAction('交互式马鞍面 z=k*(x^2-y^2)')" class="flex items-center justify-between p-4 rounded-2xl bg-slate-800/30 hover:bg-slate-800 border border-white/5 group transition-all">
                            <span class="text-xs font-bold text-slate-300 group-hover:text-emerald-400">变系数马鞍面</span>
                            <svg class="w-4 h-4 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
                        </button>
                        <button onclick="quickAction('可调参数的3D螺旋曲线')" class="flex items-center justify-between p-4 rounded-2xl bg-slate-800/30 hover:bg-slate-800 border border-white/5 group transition-all">
                            <span class="text-xs font-bold text-slate-300 group-hover:text-yellow-400">动态螺旋线</span>
                            <svg class="w-4 h-4 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
                        </button>
                    </div>
                </div>
            </div>

            <div class="pt-6 mt-auto border-t border-white/5">
                <div id="status-msg" class="text-[10px] font-black uppercase tracking-[0.2em] text-blue-500/60">System Ready</div>
            </div>
        </aside>
 <!-- MRX CopyRight 2026 -->
        <!-- 3D 画布区域 -->
        <main id="canvas-container"></main>
        
        <!-- Fullscreen button -->
        <button id="fullscreen-btn" title="Enter Fullscreen">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
            </svg>
        </button>
    </div>

    <script>
        const apiKey = "AIzaSyCR3vgrFwzHP_mWR9jYuo_mpPYYniZpXqM";
        let scene, camera, renderer, controls, currentObject = null;
        let isListening = false;
        let currentMetadata = null; 
        let currentVariables = {}; 

        function initThree() {
            const container = document.getElementById('canvas-container');
            const width = container.clientWidth;
            const height = container.clientHeight;

            scene = new THREE.Scene();
            scene.background = null; // 透明背景，使用 CSS 渐变

            camera = new THREE.PerspectiveCamera(50, width / height, 0.1, 2000);
            camera.position.set(12, 12, 12);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(width, height);
            renderer.localClippingEnabled = true;
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.04;

            // 灯光升级
            const ambient = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambient);

            const sun = new THREE.DirectionalLight(0xffffff, 0.8);
            sun.position.set(20, 30, 10);
            scene.add(sun);

            const rim = new THREE.PointLight(0x60a5fa, 0.6);
            rim.position.set(-20, -10, -10);
            scene.add(rim);

            // 高清晰双层网格
            const mainGrid = new THREE.GridHelper(40, 40, 0x334155, 0x1e293b);
            mainGrid.material.opacity = 0.4;
            mainGrid.material.transparent = true;
            scene.add(mainGrid);

            const subGrid = new THREE.GridHelper(40, 80, 0x0f172a, 0x0f172a);
            subGrid.material.opacity = 0.1;
            subGrid.material.transparent = true;
            subGrid.position.y = -0.01;
            scene.add(subGrid);

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function onWindowResize() {
            const container = document.getElementById('canvas-container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        async function processInput(text) {
            if (!text || text.trim() === "") return;
            showStatus("AI Computing...");
            
            const systemPrompt = `
                你是一个数学可视化建模专家。将用户指令转为 JSON。
                美学准则：
                - 默认颜色使用高饱和度的专业色值（如 #60a5fa, #34d399, #f472b6, #fbbf24）。
                - 初始参数值应居中且能清晰展示几何特征。
                
                支持类型：
                1. "plot": 2D f(x)。
                2. "curveParametric": 3D 曲线 (t)。
                3. "surfaceParametric": 3D 曲面 (u,v)。
                4. "shape3D": 几何体剖切。

                JSON 格式：
                {
                    "type": string,
                    "params": { 
                        "formula/xFunc/yFunc/zFunc": string, 
                        "controls": [{"name": "a", "label": "描述", "min": 0, "max": 10, "step": 0.1, "value": 2.5}] 
                    },
                    "latexTemplate": "LaTeX 模板，变量用 {name}",
                    "explanation": "简短中文说明"
                }
            `;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `指令: "${text}"` }] }],
                        systemInstruction: { parts: [{ text: systemPrompt }] },
                        generationConfig: { responseMimeType: "application/json" }
                    })
                });

                const data = await response.json();
                const result = JSON.parse(data.candidates[0].content.parts[0].text);
                
                currentMetadata = result;
                setupUI(result);
                renderVisualization(result);
                
                const resEl = document.getElementById('ai-response');
                resEl.innerText = result.explanation;
                resEl.classList.remove('hidden');
                showStatus("Synchronized");
            } catch (error) {
                console.error(error);
                showStatus("AI Analysis Failed");
            }
        }
<!-- Woshidashabi 2026 -->
        function setupUI(data) {
            const sliderBox = document.getElementById('dynamic-sliders');
            sliderBox.innerHTML = '';
            currentVariables = {};
            document.getElementById('formula-section').classList.remove('hidden');
            
            if (data.params && data.params.controls) {
                document.getElementById('controls-section').classList.remove('hidden');
                data.params.controls.forEach(ctrl => {
                    currentVariables[ctrl.name] = ctrl.value;
                    const div = document.createElement('div');
                    div.className = "space-y-3";
                    div.innerHTML = `
                        <div class="flex justify-between items-center">
                            <span class="text-[10px] text-slate-500 font-black uppercase tracking-widest">${ctrl.label}</span>
                            <span id="val-${ctrl.name}" class="text-xs font-mono text-white px-2 py-0.5 bg-blue-500/20 rounded-md border border-blue-500/20">${ctrl.value}</span>
                        </div>
                        <input type="range" class="w-full" min="${ctrl.min}" max="${ctrl.max}" step="${ctrl.step}" value="${ctrl.value}" 
                               oninput="updateVariable('${ctrl.name}', this.value)">
                    `;
                    sliderBox.appendChild(div);
                });
            } else {
                document.getElementById('controls-section').classList.add('hidden');
            }
            updateFormulaDisplay();
        }

        function updateVariable(name, val) {
            currentVariables[name] = parseFloat(val);
            const displayVal = document.getElementById(`val-${name}`);
            if (displayVal) displayVal.innerText = val;
            updateFormulaDisplay();
            if (currentMetadata) renderVisualization(currentMetadata, true);
        }

        function updateFormulaDisplay() {
            if (!currentMetadata || !currentMetadata.latexTemplate) return;
            let latex = currentMetadata.latexTemplate;
            Object.keys(currentVariables).forEach(key => {
                const val = currentVariables[key];
                latex = latex.replace(new RegExp(`{${key}}`, 'g'), (typeof val === 'number' ? val.toFixed(2) : "0.00"));
            });
            const container = document.getElementById('formula-display');
            if (container) katex.render(latex, container, { throwOnError: false, displayMode: true });
        }

        function renderVisualization(data, isUpdate = false) {
            if (currentObject) {
                scene.remove(currentObject);
                if (!isUpdate && currentObject.geometry) currentObject.geometry.dispose();
            }

            try {
                switch(data.type) {
                    case "plot": drawPlot(data.params, isUpdate); break;
                    case "curveParametric": drawCurve(data.params, isUpdate); break;
                    case "surfaceParametric": drawSurface(data.params, isUpdate); break;
                    case "shape3D": drawShape(data.params, isUpdate); break;
                }
            } catch (e) { console.error(e); }
        }

        // --- 专业材质与渲染 ---

        function drawPlot(p, isUpdate) {
            const points = [];
            const compiled = math.compile(p.formula);
            for (let x = -15; x <= 15; x += 0.05) {
                try {
                    const y = compiled.evaluate({ ...currentVariables, x });
                    if (isFinite(y)) points.push(new THREE.Vector3(x, y, 0));
                } catch(e) {}
            }
            currentObject = new THREE.Line(new THREE.BufferGeometry().setFromPoints(points), 
                new THREE.LineBasicMaterial({ color: p.color || 0x60a5fa, linewidth: 2 }));
            scene.add(currentObject);
            if(!isUpdate) resetCam({x:0, y:0, z:22});
        }

        function drawCurve(p, isUpdate) {
            const points = [];
            const cx = math.compile(p.xFunc); 
            const cy = math.compile(p.yFunc); 
            const cz = math.compile(p.zFunc || "0");
            for (let t = 0; t <= 40; t += 0.04) {
                try {
                    const vars = { ...currentVariables, t, x: t, y: t, z: t };
                    points.push(new THREE.Vector3(cx.evaluate(vars), cz.evaluate(vars), cy.evaluate(vars)));
                } catch(e) {}
            }
            currentObject = new THREE.Line(new THREE.BufferGeometry().setFromPoints(points), 
                new THREE.LineBasicMaterial({ color: p.color || 0xfacc15, linewidth: 3 }));
            scene.add(currentObject);
            if(!isUpdate) resetCam({x:18, y:18, z:18});
        }

        function drawSurface(p, isUpdate) {
            const segs = 70;
            const vertices = []; const indices = [];
            const cx = math.compile(p.xFunc || "u"); 
            const cy = math.compile(p.yFunc || "v"); 
            const cz = math.compile(p.zFunc);
            
            for (let i = 0; i <= segs; i++) {
                const u = -6 + (i/segs)*12;
                for (let j = 0; j <= segs; j++) {
                    const v = -6 + (j/segs)*12;
                    const vars = { ...currentVariables, u, v, x: u, y: v };
                    vertices.push(cx.evaluate(vars), cz.evaluate(vars), cy.evaluate(vars));
                }
            }
            for (let i = 0; i < segs; i++) {
                for (let j = 0; j < segs; j++) {
                    const a = i*(segs+1)+j; const b = i*(segs+1)+j+1; const c = (i+1)*(segs+1)+j; const d = (i+1)*(segs+1)+j+1;
                    indices.push(a, b, d, a, d, c);
                }
            }
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            geo.setIndex(indices); geo.computeVertexNormals();
            
            // 升级为 Physical 材质
            const mat = new THREE.MeshPhysicalMaterial({
                color: p.color || 0x3b82f6,
                side: THREE.DoubleSide,
                metalness: 0.1,
                roughness: 0.4,
                transparent: true,
                opacity: 0.85,
                clearcoat: 1,
                clearcoatRoughness: 0.1,
                transmission: 0.2
            });
            
            currentObject = new THREE.Mesh(geo, mat);
            scene.add(currentObject);
            if(!isUpdate) resetCam({x:14, y:16, z:14});
        }

        function drawShape(p, isUpdate) {
            let geo;
            if(p.type === 'sphere') geo = new THREE.SphereGeometry(5, 64, 64);
            else if(p.type === 'cylinder') geo = new THREE.CylinderGeometry(4, 4, 8, 32);
            else geo = new THREE.BoxGeometry(6, 6, 6);
            
            const normal = new THREE.Vector3(...(p.sliceNormal || [0, 1, 0])).normalize();
            const offset = currentVariables.offset || 0;
            
            const mat = new THREE.MeshPhysicalMaterial({ 
                color: p.color || 0x10b981, 
                side: THREE.DoubleSide, 
                clippingPlanes: p.slice ? [new THREE.Plane(normal, offset)] : [], 
                clipShadows: true,
                metalness: 0.2,
                roughness: 0.3
            });
            currentObject = new THREE.Mesh(geo, mat);
            scene.add(currentObject);
            if(!isUpdate) resetCam({x:15, y:15, z:15});
        }

        function resetCam(p) {
            camera.position.set(p.x, p.y, p.z);
            controls.target.set(0, 0, 0);
            controls.update();
        }

        // --- 语音逻辑 ---
        
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const rec = new SpeechRecognition();
            rec.lang = 'zh-CN';
            rec.interimResults = true;
            rec.onstart = () => { isListening = true; updateMicUI(); showStatus("Listening..."); };
            rec.onresult = (e) => { 
                let interim = '', final = '';
                for (let i = e.resultIndex; i < e.results.length; ++i) {
                    if (e.results[i].isFinal) final += e.results[i][0].transcript;
                    else interim += e.results[i][0].transcript;
                }
                const inputEl = document.getElementById('user-input');
                if (final) { inputEl.value = final; processInput(final); }
                else { inputEl.value = interim; }
            };
            rec.onerror = () => { isListening = false; updateMicUI(); showStatus("Mic Fault"); };
            rec.onend = () => { isListening = false; updateMicUI(); };
            document.getElementById('mic-btn').onclick = () => isListening ? rec.stop() : rec.start();
        }

        function updateMicUI() {
            const btn = document.getElementById('mic-btn');
            if (isListening) btn.classList.add('pulse-mic', 'bg-red-500/10');
            else btn.classList.remove('pulse-mic', 'bg-red-500/10');
        }

        function showStatus(msg) {
            const el = document.getElementById('status-msg');
            el.innerText = msg;
            el.style.opacity = 1;
            if(!isListening && !msg.includes("...")) setTimeout(() => el.style.opacity = 0.5, 3000);
        }

        document.getElementById('send-btn').onclick = () => processInput(document.getElementById('user-input').value);
        document.getElementById('user-input').onkeypress = (e) => e.key === 'Enter' && processInput(e.target.value);
        function quickAction(t) { document.getElementById('user-input').value = t; processInput(t); }

        // Fullscreen functionality
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const mainLayout = document.querySelector('.main-layout');
        
        function toggleFullscreen() {
            if (!document.fullscreenElement && !document.webkitFullscreenElement && 
                !document.mozFullScreenElement && !document.msFullscreenElement) {
                // Enter fullscreen
                if (mainLayout.requestFullscreen) {
                    mainLayout.requestFullscreen();
                } else if (mainLayout.webkitRequestFullscreen) {
                    mainLayout.webkitRequestFullscreen();
                } else if (mainLayout.mozRequestFullScreen) {
                    mainLayout.mozRequestFullScreen();
                } else if (mainLayout.msRequestFullscreen) {
                    mainLayout.msRequestFullscreen();
                }
            } else {
                // Exit fullscreen
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.mozCancelFullScreen) {
                    document.mozCancelFullScreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            }
        }
        
        function updateFullscreenButton() {
            const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement || 
                                 document.mozFullScreenElement || document.msFullscreenElement;
            if (isFullscreen) {
                fullscreenBtn.classList.add('hidden');
            } else {
                fullscreenBtn.classList.remove('hidden');
            }
            // Update renderer size when entering/exiting fullscreen
            onWindowResize();
        }
        
        fullscreenBtn.addEventListener('click', toggleFullscreen);
        
        // Listen for fullscreen changes
        document.addEventListener('fullscreenchange', updateFullscreenButton);
        document.addEventListener('webkitfullscreenchange', updateFullscreenButton);
        document.addEventListener('mozfullscreenchange', updateFullscreenButton);
        document.addEventListener('MSFullscreenChange', updateFullscreenButton);
        
        // Exit fullscreen on ESC key (standard browser behavior, but we ensure button visibility)
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                updateFullscreenButton();
            }
        });

        window.onload = initThree;
    </script>
</body>
</html>
